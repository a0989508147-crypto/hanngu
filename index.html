    /* Thẻ tra từ nổi, tự tránh mép màn hình */
    function WordPopover({ anchor, word, lookup, saved, hits, onRetry, onSave, onSetPos, onToneClick }) {
      const tipRef = useRef(null);
      const [pos, setPos] = useState(null);
      const key = keyOf(word);
      const autoPos = (dictLookup(key) || {}).pos || null;
      const [p, setP] = useState(() => (saved && POS[saved.pos] ? saved.pos : autoPos || 'other'));
      const [showAllPos, setShowAllPos] = useState(false);
      const syllables = pinyinSyllables(key).map(s => ({ syl: s, tone: toneInfo(toneNumOf(s)) }));
      const alt = altForm(key);

      useEffect(() => { if (saved && POS[saved.pos]) setP(saved.pos); }, [saved && saved.pos]);
      const measureKey = `${lookup ? lookup.status : ''}|${lookup && lookup.text ? lookup.text : ''}|${saved ? 1 : 0}|${hits}`;

      useLayoutEffect(() => {
        if (!anchor) return;
        const place = () => {
          const a = anchor.getBoundingClientRect();
          const vw = window.innerWidth, vh = window.innerHeight, margin = 12;
          const w = Math.min(290, vw - margin * 2);
          const h = tipRef.current ? tipRef.current.offsetHeight : 260;
          let left = a.left + a.width / 2 - w / 2;
          left = Math.max(margin, Math.min(left, vw - w - margin));
          const spaceAbove = a.top - margin, spaceBelow = vh - a.bottom - margin;
          const above = spaceAbove >= h + 10 || spaceAbove > spaceBelow;
          let top = above ? a.top - h - 10 : a.bottom + 10;
          top = Math.max(margin, Math.min(top, vh - h - margin));
          const arrow = Math.max(18, Math.min(w - 18, a.left + a.width / 2 - left));
          setPos({ left, top, w, above, arrow });
        };
        place();
        window.addEventListener('resize', place);
        window.addEventListener('scroll', place, true);
        return () => { window.removeEventListener('resize', place); window.removeEventListener('scroll', place, true); };
      }, [anchor, measureKey]);

      const choosePos = v => { setP(v); if (saved) onSetPos(key, v); };

      return ReactDOM.createPortal(
        <div ref={tipRef} onClick={e => e.stopPropagation()} className="fixed z-40"
          style={{ left: pos ? pos.left : 0, top: pos ? pos.top : 0, width: pos ? pos.w : Math.min(290, window.innerWidth - 24), visibility: pos ? 'visible' : 'hidden' }}>
          <div className="tip-in relative rounded-2xl bg-white p-5 shadow-[0_24px_60px_-12px_rgba(15,23,42,0.28),0_2px_8px_rgba(15,23,42,0.06)]">
            <div className="flex items-center justify-between gap-3">
              <div className="min-w-0">
                <div className="py text-sm text-emerald-600">{syllables.map(s => s.syl).join(' ')}</div>
                <div className="zy text-sm text-sky-600">{zhuyinWord(key)}</div>
                <div className="zh text-3xl font-semibold tracking-tight text-slate-900">{disp(key)}</div>
                {alt && <div className="text-xs text-slate-400">{SCRIPT.mode === 'simp' ? 'Phồn thể' : 'Giản thể'}: <span className="zh">{alt}</span></div>}
              </div>
              <div className="flex items-center gap-1">
                {hits >= 1 && <CountBadge n={hits} long />}
                <button onClick={() => speak(key)} aria-label="Đọc từ này" className="grid h-10 w-10 place-items-center rounded-full text-slate-400 hover:bg-slate-50 hover:text-emerald-600">
                  <SpeakerIcon className="w-5 h-5" />
                </button>
              </div>
            </div>

            <div className="mt-2 min-h-[28px] text-lg font-medium text-slate-900">
              {!lookup || lookup.status === 'loading' ? (
                <span className="flex items-center gap-2 text-sm text-slate-500"><Spinner className="w-3.5 h-3.5" /> Đang tra…</span>
              ) : lookup.status === 'error' ? (
                <button onClick={onRetry} className="py-1 text-left text-sm text-rose-500">{lookup.message || 'Tra từ thất bại'}, bấm để thử lại</button>
              ) : lookup.text}
            </div>
            <div className="mt-2 flex flex-wrap items-center gap-1">
              {syllables.map((x, i) => (
                <button key={i} onClick={() => onToneClick(x.tone.id)} title="Đánh dấu trên bảng thanh điệu"
                  className="rounded-md px-1.5 py-0.5 text-xs text-slate-400 transition hover:bg-emerald-50 hover:text-emerald-700">
                  {syllables.length > 1 && <span className="py mr-1 text-slate-500">{x.syl}</span>}
                  {x.tone.name}
                </button>
              ))}
            </div>
            {lookup && lookup.status === 'done' && lookup.source && <div className="mt-0.5 px-1.5 text-[11px] text-slate-300">Nguồn: {lookup.source}</div>}

            <div className="mt-4">
              {!showAllPos ? (
                <div className="flex items-center justify-between gap-2">
                  <span className={`rounded-full px-3 py-1 text-sm font-medium ${posInfo(p).tag}`}>{posInfo(p).label}{!saved && autoPos === p ? ' ✓' : ''}</span>
                  <button onClick={() => setShowAllPos(true)} className="px-1 py-1 text-xs text-slate-400 transition hover:text-slate-600">{autoPos || saved ? 'Đổi từ loại' : 'Chọn từ loại'}</button>
                </div>
              ) : (
                <div className="grid grid-cols-3 gap-1">
                  {Object.entries(POS).map(([k, v]) => (
                    <button key={k} onClick={() => { choosePos(k); setShowAllPos(false); }} aria-pressed={p === k}
                      className={`rounded-lg py-2 text-sm font-medium transition ${p === k ? 'bg-emerald-50 text-emerald-700' : 'text-slate-400 opacity-40 hover:opacity-100'}`}>
                      {v.label}
                    </button>
                  ))}
                </div>
              )}
              <button onClick={() => onSave(word, p)}
                className={`mt-3 w-full rounded-xl py-3 text-sm font-semibold transition active:scale-[.98] ${saved ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-900 text-white hover:bg-slate-700'}`}>
                {saved ? '⭐ Lưu lại lần nữa (+1 lần)' : `⭐ Lưu từ này (${posInfo(p).label})`}
              </button>
            </div>
            {pos && <span className={`absolute h-3 w-3 rotate-45 bg-white ${pos.above ? '-bottom-1.5' : '-top-1.5'}`} style={{ left: pos.arrow - 6 }} />}
          </div>
        </div>,
        document.body
      );
    }

    /* =========================================================
       14. Thuật luyện kim: ghép 2 từ thành cụm từ + câu ví dụ (ngữ pháp tiếng Trung)
       ========================================================= */
    const LIKE_VERBS = new Set(['想', '要', '喜歡', '愛', '需要']);
    const capVi = t => (t ? t.charAt(0).toUpperCase() + t.slice(1) : t);
    function synthesize(a, b) {
      const r = synthesizeRaw(a, b);
      return { ...r, sentenceVi: capVi(r.sentenceVi) };
    }
    function synthesizeRaw(a, b) {
      const mean = w => firstMeaning(w.meaning) || firstMeaning((dictLookup(w.word) || {}).vi) || w.word;
      let x = a, y = b;
      const isP = w => w.pos === 'pron';
      const isAdj = w => w.pos === 'adj';
      if (isP(y) && !isP(x)) [x, y] = [y, x];
      else if (x.pos === 'noun' && y.pos === 'verb') [x, y] = [y, x];
      else if (x.pos === 'noun' && isAdj(y)) [x, y] = [y, x];
      else if (x.pos === 'noun' && y.pos === 'clf') [x, y] = [y, x];

      const X = x.word, Y = y.word, mx = mean(x), my = mean(y);

      for (const [p1, p2] of [[a, b], [b, a]]) {
        const combo = DICT[p1.word + p2.word];
        if (combo) {
          const phrase = p1.word + p2.word, trans = firstMeaning(combo.vi);
          return combo.pos === 'noun'
            ? { phrase, trans, sentence: `我喜歡${phrase}。`, sentenceVi: `Tôi thích ${trans}.` }
            : { phrase, trans, sentence: `今天我想${phrase}。`, sentenceVi: `Hôm nay tôi muốn ${trans}.` };
        }
      }
      if (isP(x) && y.pos === 'verb') return { phrase: X + Y, trans: `${mx} ${my}`, sentence: `${X}想${Y}。`, sentenceVi: `${mx} muốn ${my}.` };
      if (isP(x) && y.pos === 'noun') return { phrase: `${X}的${Y}`, trans: `${my} của ${mx}`, sentence: `這是${X}的${Y}。`, sentenceVi: `Đây là ${my} của ${mx}.` };
      if (isP(x) && isAdj(y)) return { phrase: `${X}很${Y}`, trans: `${mx} rất ${my}`, sentence: `${X}今天很${Y}。`, sentenceVi: `Hôm nay ${mx} rất ${my}.` };
      if (x.pos === 'clf' && y.pos === 'noun') return { phrase: `一${X}${Y}`, trans: `một ${my}`, sentence: `我想買一${X}${Y}。`, sentenceVi: `Tôi muốn mua một ${my}.` };
      if (x.pos === 'verb' && y.pos === 'noun') {
        if (LIKE_VERBS.has(X)) return { phrase: X + Y, trans: `${mx} ${my}`, sentence: `我${X}${Y}。`, sentenceVi: `Tôi ${mx} ${my}.` };
        return { phrase: X + Y, trans: `${mx} ${my}`, sentence: `我想${X}${Y}。`, sentenceVi: `Tôi muốn ${mx} ${my}.` };
      }
      if (isAdj(x) && y.pos === 'noun') return { phrase: `${X}的${Y}`, trans: `${my} ${mx}`, sentence: `這個${Y}很${X}。`, sentenceVi: `${my} này rất ${mx}.` };
      if (x.pos === 'verb' && y.pos === 'verb') return { phrase: `${X}、${Y}`, trans: `${mx}, ${my}`, sentence: `今天我想${X}，也想${Y}。`, sentenceVi: `Hôm nay tôi muốn ${mx}, cũng muốn ${my}.` };
      if (x.pos === 'noun' && y.pos === 'noun') return { phrase: `${X}和${Y}`, trans: `${mx} và ${my}`, sentence: `我喜歡${X}和${Y}。`, sentenceVi: `Tôi thích ${mx} và ${my}.` };
      return { phrase: `${X}・${Y}`, trans: `${mx} + ${my}`, sentence: `今天我學了${X}和${Y}。`, sentenceVi: `Hôm nay tôi đã học: ${mx}, ${my}.` };
    }

    /* =========================================================
       15. Xuất thẻ từ vựng thành ảnh (16:9 tiện ích / 9:16 hình nền)
       ========================================================= */
    function drawWidget(canvas, items, orient) {
      const land = orient === 'landscape';
      const W = land ? 1600 : 1080, H = land ? 900 : 1920;
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      const FONT = SCRIPT.mode === 'simp'
        ? "'Be Vietnam Pro', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        : "'Be Vietnam Pro', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif";
      const font = (weight, size) => `${weight} ${size}px ${FONT}`;
      const fit = (text, maxW) => {
        if (ctx.measureText(text).width <= maxW) return text;
        let t = text;
        while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
        return t + '…';
      };
      const roundRect = (x, y, w, h, r) => {
        ctx.beginPath(); ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
      };
      ctx.fillStyle = '#FBF8F1'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#EDE7DA'; ctx.lineWidth = 2; roundRect(24, 24, W - 48, H - 48, 40); ctx.stroke();

      const pad = land ? 96 : 100;
      const date = new Date().toLocaleDateString('vi-VN', { year: 'numeric', month: 'long', day: 'numeric' });
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#10B981'; ctx.beginPath(); ctx.arc(pad + 9, land ? 118 : 168, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#64748B'; ctx.font = font(600, land ? 28 : 36); ctx.textAlign = 'left';
      ctx.fillText('HànNgữ Alchemy', pad + 30, land ? 128 : 180);
      ctx.fillStyle = '#1E293B'; ctx.font = font(700, land ? 58 : 80);
      ctx.fillText('Từ vựng phải nhớ hôm nay', pad, land ? 200 : 300);
      ctx.fillStyle = '#94A3B8'; ctx.font = font(400, land ? 26 : 34);
      if (land) { ctx.textAlign = 'right'; ctx.fillText(date, W - pad, 128); ctx.textAlign = 'left'; }
      else ctx.fillText(date, pad, 360);

      const top = land ? 250 : 440, bottom = land ? H - 90 : H - 170, rowH = (bottom - top) / 5;
      items.slice(0, 5).forEach((it, i) => {
        const y = top + i * rowH;
        if (i > 0) { ctx.strokeStyle = '#EDE7DA'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke(); }
        const badge = `×${it.hits}`;
        ctx.font = font(700, land ? 28 : 36);
        const bw = ctx.measureText(badge).width + (land ? 36 : 44), bh = land ? 50 : 62;
        const bx = W - pad - bw, by = land ? y + (rowH - bh) / 2 : y + rowH * 0.2;
        ctx.fillStyle = '#FFFBEB'; roundRect(bx, by, bw, bh, 14); ctx.fill();
        ctx.fillStyle = '#D97706'; ctx.textAlign = 'center'; ctx.fillText(badge, bx + bw / 2, by + bh * 0.68); ctx.textAlign = 'left';
        ctx.fillStyle = '#10B981'; ctx.font = font(600, land ? 26 : 32);
        ctx.fillText(String(i + 1).padStart(2, '0'), pad, land ? y + rowH * 0.5 : y + rowH * 0.36);
        const tx = pad + (land ? 70 : 84);
        const word = disp(it.word);
        if (land) {
          const mid = W * 0.5;
          ctx.fillStyle = '#1E293B'; ctx.font = font(700, 58); ctx.fillText(fit(word, mid - tx - 30), tx, y + rowH * 0.56);
          ctx.fillStyle = '#10B981'; ctx.font = font(500, 24); ctx.fillText(fit(it.py, mid - tx - 30), tx, y + rowH * 0.86);
          ctx.fillStyle = '#475569'; ctx.font = font(500, 38); ctx.fillText(fit(it.meaning, bx - mid - 40), mid, y + rowH * 0.62);
        } else {
          ctx.fillStyle = '#1E293B'; ctx.font = font(700, 80); ctx.fillText(fit(word, bx - tx - 30), tx, y + rowH * 0.44);
          ctx.fillStyle = '#10B981'; ctx.font = font(500, 32); ctx.fillText(fit(it.py, W - pad - tx), tx, y + rowH * 0.66);
          ctx.fillStyle = '#475569'; ctx.font = font(500, 40); ctx.fillText(fit(it.meaning, W - pad - tx), tx, y + rowH * 0.88);
        }
      });
      ctx.fillStyle = '#94A3B8'; ctx.font = font(400, land ? 22 : 30);
      ctx.fillText('Mỗi ngày nhìn một lần, hơn học thuộc mười lần', pad, H - (land ? 52 : 92));
    }

    function WidgetExporter({ open, items, onClose }) {
      const [orient, setOrient] = useState('landscape');
      const [url, setUrl] = useState(null);
      useEffect(() => {
        if (!open) return;
        let cancelled = false;
        setUrl(null);
        (async () => {
          try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
          if (cancelled) return;
          const c = document.createElement('canvas');
          drawWidget(c, items, orient);
          setUrl(c.toDataURL('image/png'));
        })();
        return () => { cancelled = true; };
      }, [open, orient, items]);
      if (!open) return null;
      const download = () => {
        if (!url) return;
        const a = document.createElement('a');
        a.href = url;
        a.download = `HanNgu-tu-vung-${new Date().toISOString().slice(0, 10)}-${orient === 'landscape' ? '16x9' : '9x16'}.png`;
        document.body.appendChild(a); a.click(); a.remove();
      };
      return (
        <div className="fixed inset-0 z-[57] flex items-end justify-center md:items-center" onClick={e => e.stopPropagation()}>
          <div className="absolute inset-0 bg-slate-900/40" onClick={onClose} />
          <div className="relative max-h-[92dvh] w-full overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl md:max-w-3xl md:rounded-2xl md:p-6" style={{ paddingBottom: 'calc(20px + env(safe-area-inset-bottom))' }}>
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-semibold text-slate-800">📱 Thẻ từ vựng cá nhân</h2>
              <button onClick={onClose} className="grid h-10 w-10 place-items-center rounded-full bg-slate-100 text-slate-500" aria-label="Đóng">✕</button>
            </div>
            <div className="mt-3 inline-grid grid-cols-2 gap-1 rounded-xl bg-slate-100 p-1">
              {[['landscape', 'Ngang 16:9 (tiện ích)'], ['portrait', 'Dọc 9:16 (hình nền)']].map(([k, label]) => (
                <button key={k} onClick={() => setOrient(k)} className={`rounded-lg px-3 py-2 text-sm font-medium transition ${orient === k ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>{label}</button>
              ))}
            </div>
            <div className={`mx-auto mt-4 overflow-hidden rounded-2xl border border-slate-100 bg-[#FBF8F1] ${orient === 'landscape' ? 'aspect-video w-full' : 'aspect-[9/16] w-[62%] max-w-[300px]'}`}>
              {url ? <img src={url} alt="Thẻ từ vựng" className="h-full w-full object-contain" /> : <div className="grid h-full place-items-center text-sm text-slate-400"><Spinner className="h-5 w-5" /></div>}
            </div>
            <button onClick={download} disabled={!url} className="mt-4 w-full rounded-xl bg-emerald-500 py-3.5 text-base font-semibold text-white transition hover:bg-emerald-600 disabled:opacity-60">💾 Tải ảnh về</button>
            <p className="mt-3 text-center text-xs leading-relaxed text-slate-400">Trên iPhone nếu bấm tải không phản hồi, hãy nhấn giữ vào ảnh và chọn “Thêm vào Ảnh”.</p>
          </div>
        </div>
      );
    }

    /* =========================================================
       16. Bản đồ nhiệm vụ chính
       ========================================================= */
    function StarRow({ n, dim, size = 'text-sm' }) {
      return (
        <span className={`inline-flex gap-px leading-none ${size} ${dim ? 'opacity-40 grayscale' : ''}`}>
          {[1, 2, 3].map(i => <span key={i} className={i <= n ? 'text-amber-400' : 'text-slate-300'}>{i <= n ? '★' : '☆'}</span>)}
        </span>
      );
    }

    function ProgressDots({ level, progress, current }) {
      return (
        <div className="flex items-center gap-1.5">
          {level.questions.map((_, i) => {
            const ok = progress && progress.done && progress.done[i];
            return (
              <span key={i} className={`grid h-7 min-w-[44px] place-items-center rounded-full px-2 text-xs font-semibold transition ${
                ok ? 'bg-emerald-500 text-white' : i === current ? 'border-2 border-emerald-400 text-emerald-700' : 'border border-slate-200 text-slate-400'}`}>
                {ok ? '✓ ' : ''}{i + 1}/{level.questions.length}
              </span>
            );
          })}
        </div>
      );
    }

    function CampaignMap({ progress, levelStates, levelStars, clockNow, unlockedChapters, busy, onStart, chapterExam, onOpenBoss }) {
      const cleared = PLAYABLE_LEVELS.filter(lv => levelStates[lv.id] === 'cleared').length;
      const current = ALL_LEVELS.find(lv => levelStates[lv.id] === 'active' || levelStates[lv.id] === 'open') || null;
      const [selected, setSelected] = useState(current ? current.id : '1-1');
      const [expanded, setExpanded] = useState(() => {
        const open = CAMPAIGN.filter(ch => unlockedChapters.includes(ch.id) && !chapterCleared(ch, progress)).map(ch => ch.id);
        return open.length ? open : [1];
      });
      const toggle = id => setExpanded(list => (list.includes(id) ? list.filter(x => x !== id) : [...list, id]));

      return (
        <div>
          <div className="flex items-center justify-between gap-3">
            <div>
              <div className="text-sm font-semibold text-slate-700">Con đường luyện kim・{CAMPAIGN.length} chương {ALL_LEVELS.length} ải</div>
              <div className="text-xs text-slate-400">Mỗi ải 3 câu: xem phân tích → nghe cả câu → ghép câu</div>
            </div>
            <span className="shrink-0 text-right text-xs text-slate-500">Đã qua <span className="font-semibold text-emerald-600">{cleared}</span> / {ALL_LEVELS.length}</span>
          </div>
          <div className="mt-2 h-1.5 overflow-hidden rounded-full bg-slate-100">
            <div className="h-full rounded-full bg-gradient-to-r from-teal-400 to-emerald-500 transition-all duration-700" style={{ width: `${(cleared / ALL_LEVELS.length) * 100}%` }} />
          </div>

          <div className="mt-5 space-y-4">
            {CAMPAIGN.map((ch, ci) => {
              const unlocked = unlockedChapters.includes(ch.id);
              const prev = CAMPAIGN[ci - 1];
              const playable = ch.levels.filter(lv => lv.questions.length);
              const doneN = playable.filter(lv => levelStates[lv.id] === 'cleared').length;
              const isOpen = expanded.includes(ch.id);
              const sel = ch.levels.find(lv => lv.id === selected);

              return (
                <section key={ch.id} className={`overflow-hidden rounded-2xl border ${unlocked ? 'border-slate-200 bg-white' : 'locked-card border-slate-200 bg-slate-100'}`}>
                  <button onClick={() => toggle(ch.id)} className={`flex w-full items-start gap-3 p-4 text-left ${unlocked ? 'bg-gradient-to-br from-emerald-50 to-teal-50' : 'locked-stripes'}`}>
                    <span className={`text-3xl leading-none ${unlocked ? '' : 'grayscale'}`}>{unlocked ? ch.icon : '🔒'}</span>
                    <span className="min-w-0 flex-1">
                      <span className="flex flex-wrap items-center gap-2">
                        <span className={`rounded-md px-1.5 py-0.5 text-xs font-semibold ${unlocked ? 'bg-slate-800 text-white' : 'bg-slate-200 text-slate-400'}`}>{ch.name}</span>
                        <span className={`text-base font-semibold ${unlocked ? 'text-slate-800' : 'text-slate-400'}`}>{ch.title}</span>
                      </span>
                      <span className={`mt-1 block text-xs leading-relaxed ${unlocked ? 'text-slate-500' : 'text-slate-400'}`}>🎯 {ch.goal}</span>
                      <span className={`mt-2 block text-xs ${unlocked ? 'text-slate-500' : 'text-slate-400'}`}>Tổng {ch.levels.length} ải・đã mở {playable.length} ải・đã qua {doneN}</span>
                    </span>
                    <span className="shrink-0 pt-1 text-sm text-slate-400">{isOpen ? '▾' : '▸'}</span>
                  </button>

                  {isOpen && (
                    <div className="border-t border-slate-100 p-4">
                      {!unlocked && <div className="mb-3 text-xs text-slate-400">🔒 {prev ? `Mở khóa khi đạt 100 điểm bài thi trùm cuối ${prev.name}` : 'Chưa mở khóa'}</div>}
                      <div className="space-y-4">
                        {ch.groups.map(g => (
                          <div key={g.from}>
                            <div className="mb-2 flex items-center justify-between text-xs">
                              <span className="font-semibold text-slate-600">{g.theme}</span>
                              <span className="text-slate-400">{ch.id}-{g.from} ～ {ch.id}-{g.to}</span>
                            </div>
                            <div className="grid grid-cols-5 justify-items-center gap-x-4 gap-y-5 sm:grid-cols-10 sm:gap-x-5">
                              {ch.levels.filter(lv => lv.n >= g.from && lv.n <= g.to).map(lv => {
                                const st = levelStates[lv.id];
                                const isCur = current && current.id === lv.id;
                                const isSel = selected === lv.id;
                                const n = starsOf(levelStars[lv.id]);
                                const cracked = isCracked(levelStars[lv.id], clockNow);
                                return (
                                  <button key={lv.id} onClick={() => setSelected(lv.id)} title={`${lv.id} ${lv.name}`} className="flex flex-col items-center gap-1 transition active:scale-95">
                                    <span className={`relative grid h-11 w-11 place-items-center rounded-full border text-sm font-semibold transition ${
                                      cracked ? 'cracked-node border-slate-300 bg-slate-200 text-slate-500'
                                        : st === 'cleared' && n >= 3 ? 'mastered-node border-amber-400 text-white'
                                        : st === 'cleared' ? 'border-emerald-500 bg-emerald-500 text-white'
                                        : st === 'active' ? 'level-open border-2 bg-amber-50 text-amber-700'
                                        : st === 'open' ? 'level-open border-2 bg-white text-slate-800'
                                        : st === 'soon' ? 'border-dashed border-slate-200 text-slate-300'
                                        : 'locked-card border-slate-100 bg-slate-100 text-slate-300'
                                    } ${isCur ? 'node-current' : ''} ${isSel ? 'ring-2 ring-slate-800 ring-offset-2 ring-offset-white' : ''}`}>
                                      {cracked ? '💢' : st === 'locked' ? <span className="text-xs">🔒</span> : st === 'soon' ? <span className="text-xs">·</span> : lv.n}
                                    </span>
                                    <span className="h-2.5 text-[9px] leading-none tracking-tight">
                                      {isPlayable(st) && !cracked
                                        ? [1, 2, 3].map(i => <span key={i} className={i <= n ? 'text-amber-400' : 'text-slate-300'}>{i <= n ? '★' : '☆'}</span>)
                                        : <span className="text-slate-300">{st === 'locked' || st === 'soon' || cracked ? lv.n : ''}</span>}
                                    </span>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>

                      {sel && (() => {
                        const st = levelStates[sel.id];
                        const p = progress[sel.id];
                        const entry = levelStars[sel.id];
                        const n = starsOf(entry);
                        const cracked = isCracked(entry, clockNow);
                        return (
                          <div key={sel.id} className="pop-in mt-4 rounded-2xl border border-slate-200 bg-slate-50 p-4">
                            <div className="flex items-start justify-between gap-3">
                              <div className="min-w-0">
                                <div className="flex items-center gap-2">
                                  <span className="rounded-md bg-white px-1.5 py-0.5 text-xs font-semibold text-slate-500">{sel.id}</span>
                                  <span className="text-base font-semibold text-slate-800">{sel.name}</span>
                                </div>
                                <div className="mt-0.5 text-xs text-slate-400">{sel.theme}{sel.questions.length ? `・${sel.questions.length} câu・khoảng ${sel.questions.length * 3} phút` : ''}</div>
                              </div>
                              {isPlayable(st) && <StarRow n={n} dim={cracked} size="text-lg" />}
                            </div>

                            {st === 'soon' ? (
                              <div className="mt-3 text-sm text-slate-500">🚧 Câu hỏi của ải này đang được soạn, hãy chờ nhé.</div>
                            ) : st === 'locked' ? (
                              <div className="mt-3 text-sm text-slate-500">🔒 {unlocked ? 'Hoàn thành ải trước để mở khóa.' : `Hãy mở khóa ${ch.name} trước.`}</div>
                            ) : (
                              <>
                                {cracked && (
                                  <div className="mt-3 rounded-xl border border-slate-300 bg-slate-100 px-4 py-3 text-sm text-slate-600">
                                    💢 Ôi không! Viên pha lê ma thuật của ải này sắp vỡ vì bạn lâu không ôn. Hãy chơi chế độ “Chỉ nghe” để sửa nó!
                                  </div>
                                )}
                                <ul className="mt-3 space-y-1">
                                  {sel.questions.map((q, i) => (
                                    <li key={i} className="flex items-center gap-2 text-sm">
                                      <span className={n >= 1 || (p && p.done && p.done[i]) ? 'text-emerald-600' : 'text-slate-300'}>{n >= 1 || (p && p.done && p.done[i]) ? '✓' : '○'}</span>
                                      <span className="text-slate-600">{q.trans}</span>
                                    </li>
                                  ))}
                                </ul>
                                <div className="mt-4 grid gap-2">
                                  {STAR_MODES.map(m => {
                                    const earned = n >= m.mode;
                                    const available = m.mode === 1 || n >= m.mode - 1;
                                    const highlight = cracked ? m.mode === 3 : !earned && available;
                                    return (
                                      <button key={m.mode} onClick={() => available && onStart(sel, m.mode)} disabled={busy || !available}
                                        className={`flex items-center gap-3 rounded-xl border px-4 py-3 text-left transition active:scale-[.99] disabled:cursor-not-allowed ${
                                          highlight ? (cracked ? 'border-slate-400 bg-white shadow-md' : 'level-open border-2 bg-white shadow-md')
                                            : available ? 'border-slate-200 bg-white hover:border-emerald-300'
                                            : 'locked-card border-slate-200 bg-slate-100 opacity-60'}`}>
                                        <span className="w-14 shrink-0 text-sm">{available ? m.stars : '🔒'}</span>
                                        <span className="min-w-0 flex-1">
                                          <span className="block text-sm font-semibold text-slate-800">{m.name}<span className="ml-1.5 font-normal text-slate-400">({m.short})</span></span>
                                          <span className="block text-xs text-slate-500">{available ? m.desc : `Cần đạt sao thứ ${m.mode - 1} trước`}</span>
                                        </span>
                                        <span className={`shrink-0 text-xs font-semibold ${earned ? 'text-amber-500' : highlight ? 'text-emerald-600' : 'text-slate-400'}`}>
                                          {cracked && m.mode === 3 ? 'Sửa →' : earned ? 'Đã đạt' : available ? 'Thử →' : ''}
                                        </span>
                                      </button>
                                    );
                                  })}
                                </div>
                                {n < 1 && p && doneCount(sel, p) > 0 && <div className="mt-2 text-xs text-slate-400">Tiến độ sao 1: {doneCount(sel, p)} / {sel.questions.length}</div>}
                              </>
                            )}
                          </div>
                        );
                      })()}
                    </div>
                  )}
                  {unlocked && (() => {
                    const rec = chapterExam[ch.id] || {};
                    const ready = chapterCleared(ch, progress);
                    const passed = !!rec.passedAt;
                    return (
                      <button onClick={() => ready && onOpenBoss(ch.id)} disabled={!ready}
                        className={`flex w-full items-center gap-3 border-t px-4 py-3.5 text-left transition ${
                          passed ? 'border-amber-200 bg-amber-50/60' : ready ? 'border-amber-200 bg-gradient-to-r from-amber-50 to-white hover:from-amber-100' : 'cursor-not-allowed border-slate-100'}`}>
                        <span className={`grid h-10 w-10 shrink-0 place-items-center rounded-full text-lg ${passed || ready ? 'mastered-node' : 'bg-slate-100 grayscale'}`}>👑</span>
                        <span className="min-w-0 flex-1">
                          <span className={`block text-sm font-semibold ${ready || passed ? 'text-slate-800' : 'text-slate-400'}`}>Bài thi trùm cuối {ch.name}</span>
                          <span className="block text-xs text-slate-500">
                            {passed ? '✅ Đã đạt điểm tuyệt đối' : ready ? `5 câu ngẫu nhiên・100 điểm ${CAMPAIGN[ci + 1] ? `mở khóa ${CAMPAIGN[ci + 1].name}` : 'chinh phục toàn bộ'}` : `Mở khi qua hết các ải đã mở của chương (${doneN} / ${playable.length})`}
                            {!passed && rec.best ? `・cao nhất ${rec.best} điểm` : ''}
                          </span>
                        </span>
                        {ready && <span className="shrink-0 text-sm font-semibold text-amber-600">{passed ? 'Thi lại →' : 'Thử sức →'}</span>}
                      </button>
                    );
                  })()}
                </section>
              );
            })}
          </div>
          <div className="mt-4 flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-slate-400">
            <span>★ Số sao</span><span>Vàng: 3 sao tối đa</span><span>💢 Nứt vì lâu không ôn</span><span>🔒 Chưa mở khóa</span><span>🚧 Đang soạn câu hỏi</span>
          </div>
        </div>
      );
    }

    /* Chơi một ải: ⭐ tra từ / ⭐⭐ ghép mù / ⭐⭐⭐ chỉ nghe 15 giây */
    function LevelRunner({ level, mode, progress, replay, showPy, onUpdate, onComplete, onEncounter, onExit, onNextLevel, nextLevel, onPlayMode }) {
      const total = level.questions.length;
      const p = progress || {};
      const useSaved = mode === 1 && !replay;
      const firstOpen = useSaved ? level.questions.findIndex((_, i) => !(p.done && p.done[i])) : 0;
      const [idx, setIdx] = useState(firstOpen === -1 ? 0 : firstOpen);
      const [phase, setPhase] = useState(mode === 1 ? 'study' : 'spell');
      const [heard, setHeard] = useState(false);
      const [tipIdx, setTipIdx] = useState(null);
      const [pool, setPool] = useState([]);
      const [placed, setPlaced] = useState([]);
      const [wrongKey, setWrongKey] = useState(null);
      const [runDone, setRunDone] = useState(() => level.questions.map((_, i) => useSaved && !!(p.done && p.done[i])));
      const [remaining, setRemaining] = useState(LISTEN_TIME);
      const [options, setOptions] = useState([]);
      const [chosen, setChosen] = useState(null);
      const deadlineRef = useRef(0);
      const completedRef = useRef(false);
      const modeInfo = STAR_MODES[mode - 1];

      const q = level.questions[idx];
      const segs = useMemo(() => segment(q.sentence).filter(w => stripPunct(w)), [q.sentence]);
      const answer = useMemo(() => answerTiles(q.sentence), [q.sentence]);
      const allDone = runDone.every(Boolean);

      const shuffleTiles = () => {
        const tiles = answer.map((t, i) => ({ id: i, t }));
        let sh = tiles;
        if (tiles.length > 1) { let n = 0; do { sh = shuffle(tiles); n++; } while (n < 20 && sh.every((x, i) => x.id === i)); }
        setPool(sh); setPlaced([]); setWrongKey(null);
      };

      useEffect(() => {
        shuffleTiles();
        setHeard(false); setTipIdx(null); setChosen(null); setOptions([]);
        setPhase(runDone[idx] ? 'solved' : mode === 1 ? 'study' : 'spell');
        deadlineRef.current = Date.now() + LISTEN_TIME;
        setRemaining(LISTEN_TIME);
        if (!(p.done && p.done[idx])) onEncounter(segs);
      }, [idx]);

      useEffect(() => {
        if (mode !== 3 || phase !== 'spell') return;
        const id = setInterval(() => {
          const r = deadlineRef.current - Date.now();
          if (r <= 0) { setRemaining(0); setPhase('timeout'); } else setRemaining(r);
        }, 100);
        return () => clearInterval(id);
      }, [mode, phase, idx]);

      useEffect(() => {
        if (allDone && !completedRef.current) { completedRef.current = true; onComplete(mode); }
      }, [allDone]);

      const listen = () => {
        speak(q.sentence);
        setHeard(true);
        if (mode === 1) onUpdate(cur => { const listened = [...(cur.listened || [])]; listened[idx] = true; return { ...cur, started: true, listened }; });
      };
      const retry = () => {
        shuffleTiles();
        deadlineRef.current = Date.now() + LISTEN_TIME;
        setRemaining(LISTEN_TIME);
        setPhase('spell');
        speak(q.sentence);
      };
      const pick = tile => {
        if (phase !== 'spell') return;
        if (tile.t !== answer[placed.length]) { setWrongKey({ id: tile.id, n: Date.now() }); return; }
        const next = [...placed, tile];
        setPlaced(next);
        setPool(list => list.filter(x => x.id !== tile.id));
        if (next.length === answer.length) {
          if (mode === 3) { setOptions(meaningOptions(q.trans)); setChosen(null); setPhase('meaning'); return; }
          setPhase('solved');
          speak(q.sentence);
          setRunDone(list => list.map((d, i) => d || i === idx));
          if (mode === 1) onUpdate(cur => { const done = [...(cur.done || [])]; done[idx] = true; return { ...cur, started: true, done }; });
        }
      };
      const chooseMeaning = opt => {
        if (phase !== 'meaning' || chosen !== null) return;
        setChosen(opt);
        speak(q.sentence);
        if (opt === q.trans) setTimeout(() => { setPhase('solved'); setRunDone(list => list.map((d, i) => d || i === idx)); }, 700);
        else setTimeout(() => setPhase('failed'), 700);
      };
      const goNext = () => {
        const target = runDone.findIndex((d, i) => !d && i > idx);
        const any = runDone.findIndex(d => !d);
        const t = target !== -1 ? target : any;
        if (t === -1) return;
        setIdx(t);
        if (mode === 3) speak(level.questions[t].sentence);
      };

      const pct = Math.max(0, Math.min(1, remaining / LISTEN_TIME));
      const barColor = remaining <= 4000 ? 'bg-rose-500' : remaining <= 8000 ? 'bg-amber-400' : 'bg-emerald-500';
      const tileHint = t => { const e = dictLookup(t); return [phoneticText(t), e ? firstMeaning(e.vi) : ''].filter(Boolean).join(' · '); };

      return (
        <div className="fade-in">
          <div className="flex items-center justify-between gap-3">
            <button onClick={onExit} className="rounded-lg px-2 py-1.5 text-sm text-slate-500 transition hover:bg-slate-100 hover:text-slate-700">← Về bản đồ</button>
            <span className="rounded-full border border-amber-200 bg-amber-50 px-3 py-1 text-xs font-semibold text-amber-700">{modeInfo.stars} {modeInfo.name}・{modeInfo.short}</span>
          </div>
          <div className="mt-2">
            <div className="flex items-center gap-2">
              <span className="rounded-md bg-slate-100 px-1.5 py-0.5 text-xs font-semibold text-slate-500">{level.id}</span>
              <span className="text-lg font-semibold text-slate-800">{level.name}</span>
            </div>
            <div className="mt-3 flex items-center justify-between gap-3">
              <ProgressDots level={level} progress={{ done: runDone }} current={idx} />
              <span className="text-xs text-slate-400">Câu {idx + 1} / {total}</span>
            </div>
          </div>

          <div key={`${idx}-${mode}`} className="pop-in mt-5 rounded-2xl border border-slate-100 bg-slate-50 p-5">
            {mode === 3 ? (
              <div className="text-center">
                <div className="text-xs text-slate-400">Chỉ nghe・không có gợi ý chữ</div>
                <button onClick={() => speak(q.sentence)} className="mx-auto mt-3 grid h-20 w-20 place-items-center rounded-full bg-emerald-500 text-white shadow-lg transition hover:bg-emerald-600 active:scale-95" aria-label="Nghe lại">
                  <SpeakerIcon className="h-9 w-9" />
                </button>
                <div className="mt-2 text-xs text-slate-400">🎧 Nghe không rõ thì bấm loa để nghe lại</div>
                {phase === 'spell' && (
                  <div className="mt-4 flex items-center gap-3">
                    <div className="h-2.5 flex-1 overflow-hidden rounded-full bg-slate-200">
                      <div className={`h-full rounded-full ${barColor} transition-[width,background-color] duration-100 ease-linear`} style={{ width: `${pct * 100}%` }} />
                    </div>
                    <span className={`w-12 text-right text-sm font-semibold tabular-nums ${remaining <= 4000 ? 'text-rose-500' : 'text-slate-500'}`}>{(remaining / 1000).toFixed(1)}s</span>
                  </div>
                )}
              </div>
            ) : (
              <>
                <div className="text-xs text-slate-400">Nghĩa tiếng Việt</div>
                <div className="mt-1 text-2xl font-semibold leading-snug text-slate-800">{q.trans}</div>
              </>
            )}

            {mode === 1 && phase === 'study' && (
              <>
                <div className="mt-4 flex flex-wrap gap-1.5">
                  {[['🔮', 'Xem phân tích', true], ['🔊', 'Nghe cả câu', heard], ['🧩', 'Ghép câu', false]].map(([icon, label, ok]) => (
                    <span key={label} className={`inline-flex items-center gap-1 rounded-full border px-2.5 py-1 text-xs font-medium ${ok ? 'border-emerald-200 bg-emerald-50 text-emerald-700' : 'border-slate-200 bg-white text-slate-400'}`}>
                      {ok ? '✓' : icon} {label}
                    </span>
                  ))}
                </div>
                <div className="mt-4 text-xs text-slate-400">Phân tích từng từ (bấm vào khối để xem nghĩa)</div>
                <div className="mt-2 flex flex-wrap gap-2 pt-1">
                  {segs.map((w, i) => {
                    const entry = dictLookup(w) || {};
                    const open = tipIdx === i;
                    return (
                      <div key={i} className="relative">
                        <button onClick={() => { setTipIdx(open ? null : i); if (!open) speak(w); }}
                          className={`flex flex-col items-center rounded-xl border px-4 py-2 transition active:scale-[.97] ${open ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-white hover:border-emerald-300'}`}>
                          {showPy && <PhonWord word={w} className="mb-1" />}
                          <span className="zh text-xl font-semibold text-slate-800">{disp(w)}</span>
                        </button>
                        {open && (
                          <div className="tip-in absolute bottom-full left-1/2 z-10 mb-2 w-max max-w-[220px] -translate-x-1/2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-left shadow-xl">
                            <div className="py text-xs text-emerald-600">{pinyinSyllables(w).join(' ')}</div>
                            <div className="zy text-xs text-sky-600">{zhuyinWord(w)}</div>
                            <div className="text-sm font-semibold text-slate-800">{firstMeaning(entry.vi) || '—'}</div>
                            <div className="mt-0.5 text-xs text-slate-500">{posInfo(entry.pos).label}・{pinyinSyllables(w).map(s => toneInfo(toneNumOf(s)).name).join(', ')}</div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
                <div className="mt-5 flex flex-col gap-2 sm:flex-row">
                  <button onClick={listen} className={`flex flex-1 items-center justify-center gap-2 rounded-xl py-3.5 text-base font-semibold transition active:scale-[.98] ${heard ? 'border border-slate-200 bg-white text-slate-600' : 'bg-emerald-500 text-white hover:bg-emerald-600'}`}>
                    <SpeakerIcon className="h-5 w-5" /> {heard ? 'Nghe lại' : 'Nghe cả câu'}
                  </button>
                  <button onClick={() => setPhase('spell')} disabled={!heard} className="flex-1 rounded-xl bg-slate-800 py-3.5 text-base font-semibold text-white transition active:scale-[.98] disabled:cursor-not-allowed disabled:opacity-40">
                    {heard ? '🧩 Bắt đầu ghép câu' : 'Nghe một lần rồi ghép'}
                  </button>
                </div>
              </>
            )}

            {(phase === 'spell' || phase === 'timeout') && (
              <div className="mt-4">
                <div className="flex items-center justify-between gap-2 text-xs text-slate-400">
                  <span>{mode === 3 ? '🧩 Bấm các khối theo thứ tự bạn nghe được' : mode === 2 ? '🧩 Ghép mù: không có gợi ý, dựa vào trí nhớ' : '🧩 Bấm các khối theo đúng thứ tự (có gợi ý bính âm và nghĩa)'}</span>
                  {mode === 2 && <button onClick={() => speak(q.sentence)} className="shrink-0 rounded-lg px-2 py-1 hover:text-emerald-600">🔊 Nghe</button>}
                </div>
                <div className="mt-3 flex min-h-[56px] flex-wrap items-center gap-2 rounded-2xl border border-dashed border-slate-200 bg-white p-3">
                  {placed.map(t => <span key={t.id} className="slot-fill zh rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-xl font-medium text-slate-800">{disp(t.t)}</span>)}
                  {Array.from({ length: answer.length - placed.length }).map((_, i) => <span key={`e${i}`} className="h-11 w-14 rounded-xl border border-dashed border-slate-200" />)}
                </div>
                <div className="mt-3 flex flex-wrap gap-2.5">
                  {pool.map(t => (
                    <button key={t.id + (wrongKey && wrongKey.id === t.id ? `-${wrongKey.n}` : '')} onClick={() => pick(t)} disabled={phase !== 'spell'}
                      className={`flex flex-col items-center rounded-xl border border-slate-200 bg-slate-100 px-5 py-3 text-slate-800 transition active:scale-95 hover:bg-emerald-50 disabled:opacity-50 md:px-4 md:py-2.5 ${wrongKey && wrongKey.id === t.id ? 'shake' : ''}`}>
                      <span className="zh text-xl font-medium">{disp(t.t)}</span>
                      {mode === 1 && <span className="mt-0.5 text-[10px] font-normal text-slate-400">{tileHint(t.t)}</span>}
                    </button>
                  ))}
                </div>
                {phase === 'timeout' && (
                  <div className="fade-in mt-4 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-center">
                    <div className="text-sm font-semibold text-rose-600">⏰ Hết giờ rồi!</div>
                    <button onClick={retry} className="mt-2 rounded-xl bg-rose-500 px-5 py-2.5 text-sm font-semibold text-white">Nghe lại・ghép lại câu này</button>
                  </div>
                )}
              </div>
            )}

            {(phase === 'meaning' || phase === 'failed') && (
              <div className="fade-in mt-4">
                <div className="flex flex-wrap items-center gap-2 rounded-2xl border border-dashed border-emerald-200 bg-white p-3">
                  {answer.map((t, i) => <span key={i} className="zh rounded-xl border border-emerald-200 bg-emerald-50 px-3.5 py-2 text-lg font-medium text-slate-800">{disp(t)}</span>)}
                </div>
                <div className="pop-in mt-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                  <div className="text-xs font-medium text-emerald-600">✓ Ghép đúng rồi! Bước cuối cùng</div>
                  <div className="mt-1 text-lg font-semibold text-slate-800">Câu này nghĩa tiếng Việt là gì?</div>
                  <div className="mt-4 flex w-full flex-col gap-2">
                    {options.map(opt => {
                      const isRight = opt === q.trans;
                      const state = chosen === null ? 'idle' : isRight ? 'right' : opt === chosen ? 'wrong' : 'dim';
                      return (
                        <button key={opt} onClick={() => chooseMeaning(opt)} disabled={chosen !== null}
                          className={`w-full rounded-full border px-5 py-3 text-left text-base font-medium transition active:scale-[.99] ${
                            state === 'idle' ? 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-emerald-50'
                              : state === 'right' ? 'exam-correct border-emerald-300 bg-emerald-50 text-emerald-700'
                              : state === 'wrong' ? 'exam-wrong border-rose-300 bg-rose-50 text-rose-600'
                              : 'border-slate-200 bg-slate-50 text-slate-400 opacity-60'}`}>
                          {state === 'right' ? '✓ ' : state === 'wrong' ? '✗ ' : ''}{opt}
                        </button>
                      );
                    })}
                  </div>
                </div>
                {phase === 'failed' && (
                  <div className="fade-in mt-4 rounded-2xl border border-rose-200 bg-rose-50 p-4 text-center">
                    <div className="text-sm font-semibold text-rose-600">💥 Chọn sai nghĩa, lượt thử sao thứ 3 kết thúc</div>
                    <div className="zh mt-2 text-lg font-semibold text-slate-800">{disp(q.sentence)}</div>
                    <PhonSentence text={q.sentence} />
                    <div className="text-sm text-slate-600">Nghĩa đúng: {q.trans}</div>
                    <div className="mt-3 grid gap-2 sm:grid-cols-2">
                      <button onClick={() => onPlayMode(3)} className="rounded-xl bg-rose-500 py-3 text-sm font-semibold text-white">Thử lại ⭐⭐⭐</button>
                      <button onClick={onExit} className="rounded-xl border border-slate-200 bg-white py-3 text-sm font-medium text-slate-600">Về bản đồ</button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {phase === 'solved' && (
              <div className="fade-in mt-5 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3">
                <div className="text-sm font-semibold text-emerald-700">{mode === 3 ? '✓ Nghe hiểu rồi! Ghép đúng và chọn đúng nghĩa' : '✓ Ghép đúng rồi!'}</div>
                <div className="zh mt-1 text-lg font-semibold text-slate-800">{disp(q.sentence)}</div>
                <PhonSentence text={q.sentence} />
                <div className="text-sm text-slate-500">{q.trans}</div>
              </div>
            )}
          </div>

          {phase === 'solved' && !allDone && (
            <button onClick={goNext} className="mt-4 w-full rounded-xl bg-emerald-500 py-3.5 text-base font-semibold text-white transition hover:bg-emerald-600">
              Câu tiếp theo →{mode === 3 ? ' (tự động phát âm)' : ''}
            </button>
          )}
          {allDone && (
            <div className={`pop-in mt-5 ${mode === 3 ? 'gold-frame' : ''}`}>
              <div className={`rounded-[22px] p-5 text-center ${mode === 3 ? 'bg-white' : 'border border-emerald-200 bg-emerald-50'}`}>
                <div className="text-3xl">{modeInfo.stars}</div>
                <div className="mt-2 text-lg font-bold text-emerald-700">Hoàn thành ải {level.id} “{modeInfo.name}”!</div>
                <div className="mt-1 text-sm text-slate-500">Ghép đúng cả {total} câu</div>
                <div className="mt-4 grid gap-2 sm:grid-cols-2">
                  {mode < 3 ? (
                    <button onClick={() => onPlayMode(mode + 1)} className="rounded-xl bg-slate-800 py-3 text-sm font-semibold text-white">Thử {STAR_MODES[mode].stars} {STAR_MODES[mode].name}</button>
                  ) : nextLevel ? (
                    <button onClick={() => onNextLevel(nextLevel)} className="rounded-xl bg-emerald-500 py-3 text-sm font-semibold text-white">Ải tiếp theo {nextLevel.id} →</button>
                  ) : (
                    <button onClick={onExit} className="rounded-xl bg-emerald-500 py-3 text-sm font-semibold text-white">Về bản đồ</button>
                  )}
                  {mode < 3 && nextLevel ? (
                    <button onClick={() => onNextLevel(nextLevel)} className="rounded-xl border border-slate-200 bg-white py-3 text-sm font-medium text-slate-600">Chơi ải {nextLevel.id} trước</button>
                  ) : (
                    <button onClick={onExit} className="rounded-xl border border-slate-200 bg-white py-3 text-sm font-medium text-slate-600">Về bản đồ</button>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* =========================================================
       17. Bài thi trùm cuối của chương: 5 câu, đạt 100 điểm để mở chương sau
       listen: nghe tiếng Trung → chọn nghĩa tiếng Việt / vi2zh: xem tiếng Việt → chọn câu tiếng Trung
       ========================================================= */
    const BOSS_SIZE = 5;
    const chapterPool = ch => ch.levels.flatMap(lv => lv.questions.map(q => ({ ...q, levelId: lv.id })));
    function buildBossExam(ch) {
      const pool = chapterPool(ch);
      if (pool.length < 3) return [];
      return shuffle(pool).slice(0, Math.min(BOSS_SIZE, pool.length)).map((q, i) => {
        const type = Math.random() < 0.5 ? 'listen' : 'vi2zh';
        const others = shuffle(pool.filter(x => x.sentence !== q.sentence && x.trans !== q.trans)).slice(0, 2);
        const options = shuffle([q, ...others]).map(o => (type === 'listen' ? o.trans : o.sentence));
        return { id: i, type, sentence: q.sentence, trans: q.trans, levelId: q.levelId, options, answer: type === 'listen' ? q.trans : q.sentence };
      });
    }

    function ChapterExamModal({ chapter, nextChapter, record, onClose, onFinish }) {
      const [phase, setPhase] = useState('intro');
      const [questions, setQuestions] = useState([]);
      const [cur, setCur] = useState(0);
      const [selected, setSelected] = useState(null);
      const [answers, setAnswers] = useState([]);
      const reportedRef = useRef(false);
      const q = questions[cur];
      const passed = !!(record && record.passedAt);
      const say = text => speak(text);

      const start = () => {
        const qs = buildBossExam(chapter);
        if (!qs.length) return;
        reportedRef.current = false;
        setQuestions(qs); setCur(0); setSelected(null); setAnswers([]); setPhase('quiz');
        if (qs[0].type === 'listen') say(qs[0].sentence);
      };
      const choose = opt => {
        if (selected !== null || !q) return;
        const ok = opt === q.answer;
        setSelected(opt);
        setAnswers(a => [...a, { ...q, chosen: opt, ok }]);
        if (q.type === 'vi2zh' || !ok) say(q.sentence);
      };
      const next = () => {
        const n = cur + 1;
        if (n >= questions.length) { setPhase('done'); return; }
        setCur(n); setSelected(null);
        if (questions[n].type === 'listen') say(questions[n].sentence);
      };
      const correct = answers.filter(a => a.ok).length;
      const score = questions.length ? Math.round((correct / questions.length) * 100) : 0;
      const perfect = phase === 'done' && correct === questions.length;
      useEffect(() => {
        if (phase !== 'done' || reportedRef.current) return;
        reportedRef.current = true;
        onFinish({ chapterId: chapter.id, score, perfect });
      }, [phase]);

      return ReactDOM.createPortal(
        <div className="fixed inset-0 z-[57] flex items-end justify-center md:items-center" onClick={e => e.stopPropagation()}>
          <div className="absolute inset-0 bg-slate-900/40" onClick={onClose} />
          <div className="relative max-h-[94dvh] w-full overflow-y-auto rounded-t-3xl bg-white p-5 shadow-2xl md:max-w-lg md:rounded-3xl md:p-7" style={{ paddingBottom: 'calc(20px + env(safe-area-inset-bottom))' }}>
            <div className="flex items-center justify-between">
              <div className="text-sm font-semibold text-slate-700">👑 Bài thi trùm cuối {chapter.name}</div>
              <button onClick={onClose} className="grid h-10 w-10 place-items-center rounded-full bg-slate-100 text-slate-500" aria-label="Đóng">✕</button>
            </div>

            {phase === 'intro' && (
              <div className="fade-in py-4 text-center">
                <div className="text-5xl">👑</div>
                <h2 className="mt-3 text-2xl font-semibold text-slate-800">{chapter.title}</h2>
                <p className="mx-auto mt-2 max-w-sm text-sm leading-relaxed text-slate-500">
                  5 câu ngẫu nhiên từ {chapterPool(chapter).length} câu của chương: nghe tiếng Trung chọn nghĩa tiếng Việt, hoặc xem tiếng Việt chọn câu tiếng Trung.
                  <br /><span className="font-medium text-slate-700">{nextChapter ? `Đạt 100 điểm để mở khóa ${nextChapter.name}.` : 'Đây là chương cuối, điểm tuyệt đối là chinh phục toàn bộ!'}</span>
                </p>
                <button onClick={start} className="alchemy-gradient mt-6 w-full max-w-xs rounded-2xl py-4 text-lg font-semibold text-white shadow-lg transition active:scale-[.98]">{passed ? 'Thi lại' : 'Bắt đầu'}</button>
                <div className="mt-4 text-sm text-slate-400">
                  {passed ? '✅ Đã đạt điểm tuyệt đối' : `Điểm cao nhất: ${(record && record.best) || 0}`}{record && record.attempts ? `・đã thi ${record.attempts} lần` : ''}
                </div>
              </div>
            )}

            {phase === 'quiz' && q && (
              <div className="fade-in mt-4">
                <div className="flex items-center justify-between gap-3">
                  <div className="flex gap-1.5">
                    {questions.map((x, i) => {
                      const a = answers[i];
                      return <span key={x.id} className={`h-2 w-8 rounded-full transition-colors ${a ? (a.ok ? 'bg-emerald-500' : 'bg-rose-500') : i === cur ? 'bg-slate-400' : 'bg-slate-200'}`} />;
                    })}
                  </div>
                  <span className="text-sm tabular-nums text-slate-500">{Math.round(correct / questions.length * 100)} điểm</span>
                </div>
                <div key={q.id} className="pop-in mt-5 rounded-2xl bg-slate-50 px-5 py-6 text-center">
                  {q.type === 'listen' ? (
                    <>
                      <div className="text-xs text-slate-400">Nghe hiểu・nghe tiếng Trung, chọn nghĩa tiếng Việt</div>
                      <button onClick={() => say(q.sentence)} className="mx-auto mt-3 grid h-20 w-20 place-items-center rounded-full bg-emerald-500 text-white shadow-lg transition hover:bg-emerald-600 active:scale-95" aria-label="Phát">
                        <SpeakerIcon className="h-9 w-9" />
                      </button>
                      <div className="mt-2 text-xs text-slate-400">Có thể bấm nghe nhiều lần</div>
                    </>
                  ) : (
                    <>
                      <div className="text-xs text-slate-400">Việt → Trung・chọn câu tiếng Trung đúng</div>
                      <div className="mt-2 text-2xl font-semibold leading-snug text-slate-800">{q.trans}</div>
                    </>
                  )}
                </div>
                <div className="mt-4 grid gap-2.5">
                  {q.options.map((opt, i) => {
                    const state = selected === null ? 'idle' : opt === q.answer ? 'right' : opt === selected ? 'wrong' : 'dim';
                    return (
                      <button key={`${q.id}-${i}`} onClick={() => choose(opt)} disabled={selected !== null}
                        className={`flex items-center gap-3 rounded-2xl border px-4 py-3.5 text-left text-base font-medium transition ${
                          state === 'idle' ? 'border-slate-200 bg-white text-slate-800 hover:border-emerald-300 hover:bg-emerald-50 active:scale-[.99]'
                            : state === 'right' ? 'exam-correct border-emerald-400 bg-emerald-50 text-emerald-700'
                            : state === 'wrong' ? 'exam-wrong border-rose-400 bg-rose-50 text-rose-600'
                            : 'border-slate-200 bg-white text-slate-400 opacity-50'}`}>
                        <span className={`grid h-7 w-7 shrink-0 place-items-center rounded-full text-sm font-semibold ${state === 'right' ? 'bg-emerald-500 text-white' : state === 'wrong' ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-500'}`}>
                          {state === 'right' ? '✓' : state === 'wrong' ? '✗' : String.fromCharCode(65 + i)}
                        </span>
                        <span className={`leading-snug ${q.type === 'vi2zh' ? 'zh text-lg' : ''}`}>{q.type === 'vi2zh' ? disp(opt) : opt}</span>
                      </button>
                    );
                  })}
                </div>
                {selected !== null && (
                  <div className="fade-in mt-4 flex flex-wrap items-center justify-between gap-3">
                    <span className={`text-sm ${selected === q.answer ? 'text-emerald-600' : 'text-rose-600'}`}>
                      {selected === q.answer ? 'Chính xác!' : <>Đáp án: {q.type === 'listen' ? q.trans : <span className="zh">{disp(q.sentence)}</span>}</>}
                    </span>
                    <button onClick={next} className="rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white">{cur + 1 >= questions.length ? 'Xem kết quả' : 'Câu tiếp →'}</button>
                  </div>
                )}
              </div>
            )}

            {phase === 'done' && (() => {
              const inner = (
                <div className={`rounded-[22px] bg-white p-6 text-center ${perfect ? '' : 'border border-slate-100'}`}>
                  {perfect ? (
                    <div className="relative">
                      {[['8%', '6%'], ['88%', '4%'], ['14%', '70%'], ['84%', '66%'], ['50%', '-4%']].map(([x, y], i) => (
                        <span key={i} className="sparkle pointer-events-none absolute text-amber-400" style={{ left: x, top: y, animationDelay: `${i * 0.3}s` }}>✦</span>
                      ))}
                      <div className="text-5xl">👑</div>
                      <div className="mt-2 text-sm font-semibold text-amber-600">{nextChapter ? `Điểm tuyệt đối! Đã mở khóa ${nextChapter.name} “${nextChapter.title}”` : 'Điểm tuyệt đối! Bạn đã chinh phục mọi chương'}</div>
                    </div>
                  ) : (
                    <>
                      <div className="text-5xl">{score >= 60 ? '💪' : '📖'}</div>
                      <div className="mt-2 text-sm text-slate-500">Còn chút xíu nữa! Cần 100 điểm để {nextChapter ? `mở khóa ${nextChapter.name}` : 'vượt qua'}, thi lại không giới hạn</div>
                    </>
                  )}
                  <div className="mt-3 text-5xl font-bold tabular-nums text-slate-800">{score}<span className="ml-1 text-xl font-medium text-slate-400">điểm</span></div>
                  <div className="mt-5 space-y-1.5 text-left">
                    {answers.map(a => (
                      <div key={a.id} className={`flex items-start justify-between gap-3 rounded-xl px-3 py-2.5 ${a.ok ? 'bg-emerald-50' : 'bg-rose-50'}`}>
                        <span className="min-w-0">
                          <span className={`mr-1.5 ${a.ok ? 'text-emerald-600' : 'text-rose-600'}`}>{a.ok ? '✓' : '✗'}</span>
                          <span className="zh font-semibold text-slate-800">{disp(a.sentence)}</span>
                          <PhonSentence text={a.sentence} className="pl-5" />
                          <span className="block pl-5 text-sm text-slate-500">{a.trans}</span>
                        </span>
                        <button onClick={() => say(a.sentence)} className="grid h-8 w-8 shrink-0 place-items-center rounded-full text-slate-400 hover:text-emerald-600" aria-label="Đọc"><SpeakerIcon /></button>
                      </div>
                    ))}
                  </div>
                  <div className="mt-5 grid grid-cols-2 gap-2">
                    <button onClick={onClose} className="rounded-xl border border-slate-200 bg-white py-3 text-sm font-medium text-slate-600">{perfect && nextChapter ? 'Xem chương mới' : 'Về bản đồ'}</button>
                    <button onClick={start} className="rounded-xl bg-slate-900 py-3 text-sm font-semibold text-white">{perfect ? 'Thi lại' : 'Thử lại'}</button>
                  </div>
                </div>
              );
              return <div className="pop-in mt-4">{perfect ? <div className="gold-frame">{inner}</div> : inner}</div>;
            })()}
          </div>
        </div>,
        document.body
      );
    }

    /* =========================================================
       18. Kho nguyên liệu của tôi (câu và từ đã lưu)
       ========================================================= */
    function Spellbook({
      inSheet, sentences, words, hits, busy,
      onOpenSentence, onRemoveSentence, onRemoveWord, onTranslateComposed, onUseSentence,
      onExportWidget, onClearAll, notify, syncConfig, syncState, onOpenSync,
    }) {
      const [tab, setTab] = useState('sentences');
      const [filter, setFilter] = useState('all');
      const [mode, setMode] = useState('synth');
      const [composer, setComposer] = useState([]);
      const [picked, setPicked] = useState([]);
      const [synthesizing, setSynthesizing] = useState(false);
      const [lastSynth, setLastSynth] = useState(null);
      const [phrases, setPhrases] = useLocalStorage('zhl.phrases', []);
      const synthTimer = useRef(null);
      useEffect(() => () => clearTimeout(synthTimer.current), []);

      const wordList = Object.values(words)
        .map(w => ({ ...w, hits: Math.max(hits[w.word] || 0, 1) }))
        .filter(w => filter === 'all' || w.pos === filter)
        .sort((a, b) => b.hits - a.hits || b.savedAt - a.savedAt);
      useEffect(() => { setPicked(p => p.filter(k => words[k])); }, [words]);

      const composed = composer.map(c => c.word).join('');
      const wordCount = Object.keys(words).length;
      const listHeight = inSheet ? '' : 'max-h-[58vh] overflow-y-auto thin-scroll pr-1';

      const handleWordClick = w => {
        if (mode === 'compose') setComposer(c => [...c, { id: `${w.word}-${Date.now()}-${Math.random()}`, word: w.word }]);
        else setPicked(p => (p.includes(w.word) ? p.filter(k => k !== w.word) : p.length < 2 ? [...p, w.word] : [p[1], w.word]));
      };
      const doSynth = () => {
        const [a, b] = picked.map(k => words[k]).filter(Boolean);
        if (!a || !b || synthesizing) return;
        const r = synthesize(a, b);
        setSynthesizing(true); setLastSynth(null);
        speak([r.phrase, r.sentence]);
        synthTimer.current = setTimeout(() => {
          const card = { ...r, id: `p${Date.now()}`, createdAt: Date.now() };
          setLastSynth(card);
          setPhrases(p => [card, ...p.filter(x => x.phrase !== r.phrase)].slice(0, 30));
          setPicked([]); setSynthesizing(false);
          notify(`Đã luyện ra cụm từ mới: ${disp(r.phrase)} (${r.trans})!`);
        }, 900);
      };
      const MODE_HINT = { synth: 'Bấm liên tiếp hai từ để ghép thành cụm từ mới.', compose: 'Bấm các từ theo thứ tự để tạo câu, rồi bấm dịch để kiểm tra.' };

      return (
        <div>
          {!inSheet && (
            <div className="mb-4">
              <h2 className="text-lg font-semibold text-slate-800">Bộ sưu tập của tôi</h2>

    /* =========================================================
       19. 🃏 Thẻ từ vựng: đọc trực tiếp danh sách "words" trong data.json
       Mặt trước: chữ phồn thể + bính âm / chú âm; bấm để lật: nghĩa tiếng Việt + câu ví dụ
       ========================================================= */
    function WordDeck({ savedWords, onSave }) {
      const levels = [...new Set(WORDS.map(w => w.level))];
      const [level, setLevel] = useLocalStorage('zhl.deckLevel', 'all');
      const [view, setView] = useLocalStorage('zhl.deckView', 'card');

      const list = useMemo(() => {
        const base = WORDS.filter(w => level === 'all' || w.level === level);
        return order ? order.map(id => base.find(w => w.id === id)).filter(Boolean) : base;
      }, [level, order]);
      useEffect(() => { setIdx(0); setFlipped(false); }, [level, order]);
      const w = list[Math.min(idx, list.length - 1)];
      const go = d => { setFlipped(false); setIdx(i => (i + d + list.length) % list.length); };
      const levelLabel = k => DEFAULT_LIBRARY_LABELS[k] || k;

      if (!WORDS.length) return <p className="py-10 text-center text-sm text-slate-400">data.json chưa có từ nào trong mảng “words”.</p>;

      const SaveBtn = ({ word }) => {
        const saved = !!savedWords[word.chinese];
        return (
          <button onClick={e => { e.stopPropagation(); onSave(word); }}
            className={`rounded-lg px-3 py-2 text-xs font-medium transition ${saved ? 'bg-emerald-50 text-emerald-700' : 'border border-slate-200 bg-white text-slate-600 hover:border-amber-300 hover:text-amber-700'}`}>
            {saved ? '⭐ Đã lưu (+1)' : '⭐ Lưu'}

          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="no-scrollbar flex gap-1.5 overflow-x-auto">
              {[['all', `Tất cả (${WORDS.length})`], ...levels.map(k => [k, `${levelLabel(k)} (${WORDS.filter(x => x.level === k).length})`])].map(([k, label]) => (
                <button key={k} onClick={() => { setLevel(k); setOrder(null); }} className={`shrink-0 rounded-full px-3.5 py-1.5 text-sm font-medium transition ${level === k ? 'bg-slate-800 text-white' : 'border border-slate-200/60 bg-white text-slate-500 hover:text-slate-700'}`}>{label}</button>

            </div>

          {view === 'card' && w ? (
            <div className="mt-4">

                <div className="text-xs text-slate-400">{idx + 1} / {list.length}・{flipped ? 'Mặt sau' : 'Bấm để lật'}</div>
                <div className="mt-3 flex justify-center"><PhonWord word={w.chinese} className="gap-0.5 [&>span]:text-sm" /></div>
                <div className="zh mt-1 text-5xl font-semibold text-slate-900">{disp(w.chinese)}</div>
                {altForm(w.chinese) && <div className="mt-1 text-xs text-slate-400">{SCRIPT.mode === 'simp' ? 'Phồn thể' : 'Giản thể'}: <span className="zh">{altForm(w.chinese)}</span></div>}
                {flipped && (
                  <div className="fade-in mt-5 border-t border-slate-100 pt-4">
                    <div className="text-xl font-semibold text-emerald-700">{w.vietnamese}</div>
                    <div className="mt-1 text-xs text-slate-400">{posInfo(w.pos).label}{w.tags.length ? `・${w.tags.join(', ')}` : ''}</div>
                    {w.example_ch && (
                      <div className="mt-4 rounded-xl bg-slate-50 px-4 py-3 text-left">
                        <div className="zh text-lg text-slate-800">{disp(w.example_ch)}</div>

                  <button onClick={() => setOrder(shuffle(WORDS.filter(x => level === 'all' || x.level === level).map(x => x.id)))} className="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-medium text-slate-600">🔀 Xáo</button>

    /* =========================================================
       19. Lớp dữ liệu đồng bộ
       - Câu, từ: mỗi bản ghi có updatedAt; khi xóa để lại dấu “đã xóa”; bản mới hơn thắng
       - Số lần gặp: mỗi thiết bị chỉ cộng của riêng mình, tổng = cộng mọi thiết bị
       ========================================================= */
    const DEVICE_ID = (() => {
      try {
        let id = localStorage.getItem('zhl.deviceId');
        if (!id) { id = 'd' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem('zhl.deviceId', id); }
        return id;
      } catch (e) { return 'd-temp'; }
    })();

    const emptyStore = () => ({ version: 1, clearedAt: 0, sentences: {}, words: {}, hits: {} });
    function loadInitialStore() {
      try { const raw = localStorage.getItem('zhl.store'); if (raw) return JSON.parse(raw); } catch (e) {}
      return emptyStore();
    }
    const alive = (item, st) => item && !item.deleted && (item.updatedAt || 0) >= (st.clearedAt || 0);
    function viewSentences(st) {
      return Object.values(st.sentences).filter(x => alive(x, st)).sort((a, b) => b.savedAt - a.savedAt)
        .map(x => ({ id: x.zh, zh: x.zh, vi: x.vi, savedAt: x.savedAt }));
    }
    function viewWords(st) {
      const out = {};
      Object.values(st.words).forEach(w => {
        if (alive(w, st)) out[w.word] = { word: w.word, meaning: w.meaning || '', pos: w.pos, savedAt: w.savedAt, reviewedAt: w.reviewedAt || w.savedAt };
      });
      return out;
    }
    function viewHits(st) {
      const total = {};
      Object.values(st.hits).forEach(h => {
        if ((h.since || 0) < (st.clearedAt || 0)) return;
        Object.entries(h.counts || {}).forEach(([k, n]) => { total[k] = (total[k] || 0) + n; });
      });
      return total;
    }
    function mergeStores(a, b) {
      if (!b) return a;
      if (!a) return b;
      const out = emptyStore();
      out.clearedAt = Math.max(a.clearedAt || 0, b.clearedAt || 0);
      ['sentences', 'words'].forEach(field => {
        const A = a[field] || {}, B = b[field] || {};
        new Set([...Object.keys(A), ...Object.keys(B)]).forEach(k => {
          const x = A[k], y = B[k];
          out[field][k] = !x ? y : !y ? x : ((y.updatedAt || 0) > (x.updatedAt || 0) ? y : x);
        });
      });
      const HA = a.hits || {}, HB = b.hits || {};
      new Set([...Object.keys(HA), ...Object.keys(HB)]).forEach(d => {
        const x = HA[d], y = HB[d];
        if (!x || !y) { out.hits[d] = x || y; return; }
        const sx = x.since || 0, sy = y.since || 0;
        if (sx !== sy) { out.hits[d] = sx > sy ? x : y; return; }
        const counts = { ...(x.counts || {}) };
        Object.entries(y.counts || {}).forEach(([k, n]) => { counts[k] = Math.max(counts[k] || 0, n); });
        out.hits[d] = { since: sx, counts };
      });
      return out;
    }
    const stable = v => {
      if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
      if (v && typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
      return JSON.stringify(v);
    };

    /* =========================================================
       20. 📡 Đồng bộ tự động (ghép nối một lần, sau đó tự gộp dữ liệu)
       ⚠️ Điền địa chỉ Cloudflare Worker của bạn vào dòng dưới đây
       ========================================================= */
    const SYNC_WORKER_URL = 'https://vietlingo-sync.a0989508147.workers.dev';
    const SYNC_KEY = 'zhl.autosync';
    const syncReady = () => /^https:\/\//.test(SYNC_WORKER_URL);
    const syncBase = () => SYNC_WORKER_URL.replace(/\/+$/, '');
    function newRoomId() {
      const bytes = new Uint8Array(18);
      crypto.getRandomValues(bytes);
      return btoa(String.fromCharCode.apply(null, bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    const validRoom = id => typeof id === 'string' && /^[A-Za-z0-9_-]{20,64}$/.test(id);
    async function syncFetch(path, options = {}) {
      let res;
      try {
        res = await fetch(`${syncBase()}${path}`, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
      } catch (e) { throw new Error('Không kết nối được máy chủ đồng bộ, hãy kiểm tra mạng'); }
      let body = null;
      try { body = await res.json(); } catch (e) {}
      if (!res.ok) throw new Error((body && body.message) || `Máy chủ đồng bộ báo lỗi (HTTP ${res.status})`);
      return body;
    }
    const roomGet = roomId => syncFetch(`/api/room/${roomId}`);
    const roomPut = (roomId, data) => syncFetch(`/api/room/${roomId}`, { method: 'PUT', body: JSON.stringify(data) });
    const pairCreate = roomId => syncFetch('/api/pair', { method: 'POST', body: JSON.stringify({ roomId }) });
    const pairClaim = code => syncFetch('/api/pair/claim', { method: 'POST', body: JSON.stringify({ code }) });

    const readLS = (key, fallback) => { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; } };

    function encodeWav(chunks, inRate, outRate = 16000) {
      const total = chunks.reduce((n, c) => n + c.length, 0);
      const data = new Float32Array(total);
      let off = 0;
      chunks.forEach(c => { data.set(c, off); off += c.length; });
      const ratio = inRate / outRate;
      const len = Math.floor(data.length / ratio);
      const pcm = new Int16Array(len);
      for (let i = 0; i < len; i++) {
        const s0 = Math.floor(i * ratio), s1 = Math.min(data.length, Math.floor((i + 1) * ratio));
        let sum = 0;
        for (let j = s0; j < s1; j++) sum += data[j];
        const v = Math.max(-1, Math.min(1, sum / Math.max(1, s1 - s0)));
        pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
      }
      const buf = new ArrayBuffer(44 + pcm.length * 2);
      const dv = new DataView(buf);
      const w = (o, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(o + i, str.charCodeAt(i)); };
      w(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE');
      w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
      dv.setUint32(24, outRate, true); dv.setUint32(28, outRate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
      w(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
      new Int16Array(buf, 44).set(pcm);
      return new Blob([buf], { type: 'audio/wav' });
    }
    function createMic() {
      let stream = null, ctx = null, stopper = null;
      return {
        async open() {
          if (stream) return;
          stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        record({ maxMs = 15000, silenceMs = 1200, noSpeechMs = 8000, onState } = {}) {
          return new Promise(async resolve => {
            if (!stream || !ctx) { resolve(null); return; }
            try { if (ctx.state === 'suspended') await ctx.resume(); } catch (e) {}
            const src = ctx.createMediaStreamSource(stream);
            const proc = ctx.createScriptProcessor(4096, 1, 1);
            const chunks = [];
            const t0 = performance.now();
            let noise = 0, noiseN = 0, speaking = false, lastVoice = t0, done = false;
            const finish = () => {
              if (done) return;
              done = true;
              try { proc.disconnect(); src.disconnect(); } catch (e) {}
              stopper = null;
              resolve(speaking ? encodeWav(chunks, ctx.sampleRate) : null);
            };
            stopper = finish;
            proc.onaudioprocess = e => {
              const d = e.inputBuffer.getChannelData(0);
              chunks.push(new Float32Array(d));
              let sum = 0;
              for (let i = 0; i < d.length; i += 4) sum += d[i] * d[i];
              const rms = Math.sqrt(sum / (d.length / 4));
              const now = performance.now();
              if (now - t0 < 350) { noise += rms; noiseN++; return; }
              const threshold = Math.max(0.012, (noise / Math.max(1, noiseN)) * 3);
              if (rms > threshold) { if (!speaking && onState) onState('speaking'); speaking = true; lastVoice = now; }
              if (!speaking && now - t0 > noSpeechMs) finish();
              if (speaking && now - lastVoice > silenceMs) finish();
              if (now - t0 > maxMs) finish();
            };
            src.connect(proc);
            proc.connect(ctx.destination);
          });
        },
        stop() { if (stopper) stopper(); },
        close() {
          if (stopper) stopper();
          try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) {}
          try { ctx && ctx.close(); } catch (e) {}
          stream = null; ctx = null;
        },
      };
    }

    function splitByScript(text) {
      const parts = [];
      const re = /[\u3400-\u9fff\uf900-\ufaff\u3000-\u303f\uff00-\uffef]+(?:[\s0-9]*[\u3400-\u9fff\uf900-\ufaff\u3000-\u303f\uff00-\uffef]+)*/g;
      let last = 0, m;
      const push = (lang, chunk) => {
        const t = chunk.replace(/^[\s,.;:!?…\-–—"'“”()（）]+|[\s,;:\-–—"'“”()（）]+$/g, '');
        if (!t || !/[\p{L}\p{N}]/u.test(t)) return;
