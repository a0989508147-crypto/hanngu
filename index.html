        const prev = parts[parts.length - 1];
        if (prev && prev.lang === lang) prev.text += ' ' + t; else parts.push({ lang, text: t });
      };
      while ((m = re.exec(text))) { push('vi', text.slice(last, m.index)); push('zh', m[0]); last = m.index + m[0].length; }

      return parts;
    }

      const [coachOpen, setCoachOpen] = useState(false);
      const micRef = useRef(null);
      const sttFallbackRef = useRef(false);
      const chatEndRef = useRef(null);
      useEffect(() => { if (chatEndRef.current) chatEndRef.current.scrollIntoView({ block: 'end' }); }, [chat]);
      const [interim, setInterim] = useState('');
      const [current, setCurrent] = useState(null);
      const [last, setLast] = useState(null);
      const [streak, setStreak] = useState(0);
      const activeRef = useRef(false);
      const recRef = useRef(null);
      const helpRef = useRef(false);
      const recentRef = useRef([]);

      const listenOnce = (lang, timeoutMs) => new Promise((resolve, reject) => {
        try { recRef.current && recRef.current.abort(); } catch (e) {}
        recRef.current = null;
        const rec = new SR();
        rec.lang = lockLang(lang);
        rec.interimResults = true;
        rec.continuous = false;
        rec.maxAlternatives = 1;
        let finalText = '', errCode = null;
        const timer = setTimeout(() => { try { rec.stop(); } catch (e) {} }, timeoutMs);
        rec.onresult = e => {
          let live = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (r.isFinal) finalText += r[0].transcript; else live += r[0].transcript;
          }
          setInterim((finalText + live).trim());
        };
        rec.onerror = e => { errCode = e.error; };
        rec.onend = () => {
          clearTimeout(timer);
          recRef.current = null;
          setInterim('');
          if (errCode === 'not-allowed' || errCode === 'service-not-allowed' || errCode === 'audio-capture') reject(new Error(speechErrorText(errCode)));
          else resolve(finalText.trim());
        };
        try { rec.start(); recRef.current = rec; } catch (e) { clearTimeout(timer); reject(new Error('Không khởi động được micro')); }
      });
      const wait = ms => new Promise(res => setTimeout(res, ms));

      /* Nghe một câu, tự nhận biết tiếng Trung hay tiếng Việt → { text, lang } */
      const smartListen = async () => {
        if (syncReady() && !sttFallbackRef.current && navigator.mediaDevices && (window.AudioContext || window.webkitAudioContext)) {
          try {
            if (!micRef.current) micRef.current = createMic();
            await micRef.current.open();
            setInterim('');
            const wav = await micRef.current.record({ onState: st => { if (st === 'speaking') setInterim('(đang nghe…)'); } });
            if (!activeRef.current) return { text: '', lang: '' };
            if (!wav) { setInterim(''); return { text: '', lang: '' }; }
            setCallState('transcribing');
            setInterim('');
            return await transcribe(wav);
          } catch (e) {
            if (/NotAllowed|Permission|denied/i.test(String(e && (e.name || e.message)))) throw new Error('Quyền micro bị từ chối, hãy cho phép trình duyệt dùng micro');
            sttFallbackRef.current = true;
            notify(`Nhận dạng song ngữ tạm thời lỗi, chuyển sang nhận dạng tiếng Trung của trình duyệt (${String((e && e.message) || '').slice(0, 30)})`);
          }
        }
        const raw = await listenOnce('zh-TW', 10000);
        return allowedSpeech(raw);
      };

      const pickQuestion = () => {
        const list = pool;
        const fresh = list.filter(x => !recentRef.current.includes(x.sentence));
        const src = fresh.length ? fresh : list;
        const item = src[Math.floor(Math.random() * src.length)];
        recentRef.current = [item.sentence, ...recentRef.current].slice(0, 8);
        return item;
      };

      /* 🍼 Đọc chậm từng từ (0.7×), khối từ sáng lên theo kiểu karaoke */
      const guidedSlow = async item => {
        setCallState('guided');
        onReveal();
        await wait(150);
        await speakMixed([{ lang: 'vi', text: 'Không sao, mình đi chậm nhé. Câu này tiếng Trung là' }]);
        const pieces = segment(item.sentence).map(stripPunct);
        for (let i = 0; i < pieces.length; i++) {
          if (!activeRef.current) break;
          if (!pieces[i]) continue;
          await speakMixed([{ lang: 'zh', text: pieces[i], rate: 0.7, onStart: () => onHighlight(i) }]);
          await wait(380);
        }
        onHighlight(null);
        if (!activeRef.current) return;
        await wait(200);
        await speakMixed([{ lang: 'vi', text: 'Đến lượt bạn nói thử nhé' }]);
      };

      const session = async () => {
        let silentRun = 0;
        await speakMixed([{ lang: 'vi', text: 'Mình cùng luyện nói nhé. Cô hỏi bằng tiếng Việt, bạn trả lời bằng tiếng Trung.' }]);
        while (activeRef.current) {
          const item = pickQuestion();
          setCurrent(item);
          setLast(null);
          setCallState('asking');
          await onLoadSentence(item, { hidden: true });
          if (!activeRef.current) break;
          await speakMixed([{ lang: 'vi', text: `Câu “${item.trans.replace(/[.!?]$/, '')}” nói bằng tiếng Trung thế nào?` }]);

          let guided = false, nearTries = 0, done = false;
          while (activeRef.current && !done) {
            await wait(250);
            if (!activeRef.current) break;
            setCallState('listening');
            helpRef.current = false;
            const said = await smartListen();
            if (!activeRef.current) break;
            // Nói tiếng Việt (ví dụ “không biết”, “gợi ý”) = xin trợ giúp
            if (said.lang === 'vi' || isHelpRequest(said.text)) helpRef.current = true;
            const heard = said.lang === 'zh' ? said.text : '';
            const score = heard ? repeatScore(heard, item.sentence) : 0;
            setLast({ heard: said.text, score });

            if (score >= 0.8 && !helpRef.current) {
              setCallState('correct');
              onReveal();
              silentRun = 0;
              setStreak(n => n + 1);
              await speakMixed([{ lang: 'vi', text: guided ? 'Giỏi lắm! Bạn nói được rồi! Sang câu tiếp nhé!' : 'Tuyệt vời! Hoàn toàn chính xác! Sang câu tiếp nhé!' }]);
              done = true;
              break;
            }
            if (!said.text && !helpRef.current) {
              silentRun++;
              if (silentRun >= 3) {
                await speakMixed([{ lang: 'vi', text: 'Hình như cô không nghe thấy bạn, lần sau mình luyện tiếp nhé, tạm biệt!' }]);
                activeRef.current = false;
                break;
              }
            } else silentRun = 0;

            setStreak(0);
            if (!helpRef.current && score >= 0.5 && nearTries === 0) {
              nearTries++;
              setCallState('feedback');
              await speakMixed([{ lang: 'vi', text: 'Gần đúng rồi! Nói lại lần nữa xem' }]);
              continue;
            }
            if (guided) {
              setCallState('feedback');
              onReveal();
              await speakMixed([{ lang: 'vi', text: 'Không sao, nhớ câu này nhé, mình sang câu khác!' }]);
              done = true;
              break;
            }
            await guidedSlow(item);
            guided = true;
          }
          if (!activeRef.current) break;
          await wait(1000);
        }
        hangUp();
      };

      const coachSession = async () => {
        const history = [];
        let userTurns = 0, silentRun = 0;
        const say = async (text, opts = {}) => {
          const c = toTW(plainText(text));
          setChat(list => [...list, { who: 'coach', text: c, summary: !!opts.summary }]);
          setCallState('coach');
          await speakMixed(splitByScript(c).map(p => ({ ...p, rate: p.lang === 'zh' ? 0.85 : 1 })));
        };
        const ask = async (content, opts = {}) => {
          history.push({ role: 'user', content });
          setCallState('thinking');
          const reply = await coachReply(history.slice(-20));
          history.push({ role: 'assistant', content: reply });
          if (!activeRef.current) return;
          await say(reply, opts);
        };
        setChat([]);
        await ask(`(${COACH_ROLE} Bắt đầu: hãy chào tôi bằng tiếng Trung đơn giản rồi hỏi tôi một câu rất dễ về cuộc sống hằng ngày.)`);
        while (activeRef.current) {
          await wait(250);
          if (!activeRef.current) break;
          setCallState('listening');
          const said = await smartListen();
          if (!activeRef.current) break;
          if (!said.text) {
            silentRun++;
            if (silentRun >= 3) { await speakMixed([{ lang: 'vi', text: 'Hôm nay mình nói đến đây thôi, hẹn gặp lại!' }]); break; }
            setChat(c => [...c, { who: 'me', text: '(bị bí…)' }]);
            await ask('(Tôi bị bí, không nói được. Hãy gợi ý 2–3 từ tiếng Trung đơn giản kèm bính âm và nghĩa tiếng Việt, đừng nói hộ cả câu.)');
            continue;
          }
          silentRun = 0;
          userTurns++;
          setChat(c => [...c, { who: 'me', text: said.text }]);
          const note = userTurns % 5 === 0 ? '\n(Hệ thống: đã trò chuyện 5 lượt, hãy tóm tắt bài học bằng tiếng Việt ở cuối câu trả lời này.)' : '';
          const tag = said.lang === 'vi' ? '(Tôi nói bằng tiếng Việt) ' : '';
          await ask(`${tag}${said.text}${note}`, { summary: !!note });
        }
        hangUp();
      };

      const hangUp = () => {
        activeRef.current = false;
        try { recRef.current && recRef.current.abort(); } catch (e) {}
        recRef.current = null;
        if (micRef.current) { micRef.current.close(); micRef.current = null; }
        sttFallbackRef.current = false;
        stopAllSpeech();
        onHighlight(null);
        onReveal();
        setCallState('idle');
        setInterim('');
      };
      const askHelp = () => {
        helpRef.current = true;
        try { recRef.current && recRef.current.stop(); } catch (e) {}
        if (micRef.current) micRef.current.stop();
      };
      const handleCall = () => {
        if (callState !== 'idle') { hangUp(); return; }
        if (!SR && !syncReady()) { notify('Trình duyệt này không hỗ trợ nhận dạng giọng nói. Máy tính hãy dùng Chrome hoặc Edge, Android dùng Chrome, iPhone dùng Safari.'); return; }
        if (syncReady() && navigator.mediaDevices) {
          micRef.current = createMic();
          micRef.current.open().catch(() => { sttFallbackRef.current = true; });
        }
        if (voiceMode === 'coach') {
          if (!syncReady()) { notify('Huấn luyện viên cần cài Worker trước (dùng chung với đồng bộ)'); return; }
          activeRef.current = true;
          setCoachOpen(true);
          setCallState('thinking');
          coachSession().catch(e => { notify(e.message || 'Cuộc trò chuyện bị gián đoạn'); hangUp(); });
          return;
        }
        if (!pool.length) { notify('Hãy bắt đầu ải đầu tiên trên bản đồ trước, cô mới có câu để hỏi bạn'); return; }
        activeRef.current = true;
        setStreak(0);
        setLast(null);
        session().catch(e => { notify(e.message || 'Luyện nói bị gián đoạn'); hangUp(); });
      };

      useEffect(() => () => { activeRef.current = false; try { recRef.current && recRef.current.abort(); } catch (e) {} }, []);
      useEffect(() => {
        if (!coachOpen) return;
        const prev = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => { document.body.style.overflow = prev; };
      }, [coachOpen]);
      const closeCoach = () => { if (callState !== 'idle') hangUp(); setCoachOpen(false); };

      const bottom = isDesktop ? 'calc(24px + env(safe-area-inset-bottom))' : 'calc(80px + env(safe-area-inset-bottom))';
      const STATUS = {
        asking: '👩‍🏫 Cô đang đặt câu hỏi',
        listening: '🎙️ Đang nghe bạn nói tiếng Trung',
        guided: '🐢 Đọc chậm từng từ (0.7×)',
        feedback: '💬 Cô đang nhận xét',
        correct: '🎉 Chính xác!',
        thinking: '🤖 Huấn luyện viên đang nghĩ…',
        transcribing: '🎧 Đang nhận dạng (tự phân biệt Trung / Việt)…',
        coach: '🤖 Huấn luyện viên đang nói',
      };
      const live = callState === 'listening';
      const coachBusy = callState !== 'idle';
      const coachStatus = !coachBusy ? 'Cuộc trò chuyện đã kết thúc, có thể kéo lên xem lại'
        : live ? '🟢 Đang nghe bạn nói… (tiếng Trung hoặc tiếng Việt đều được)'
        : callState === 'transcribing' ? '🎧 Đang nhận dạng…'
        : callState === 'thinking' ? '🤖 Đang nghĩ…'
        : '🔊 Huấn luyện viên đang nói';

      if (coachOpen) {
        return ReactDOM.createPortal(
          <div className="fixed inset-0 z-[60] flex flex-col bg-slate-50" style={{ paddingTop: 'env(safe-area-inset-top)' }} onClick={e => e.stopPropagation()}>
            <div className="flex-none">
              <div className="mx-auto flex max-w-2xl items-center justify-between px-6 pt-4 md:px-10 md:pt-8">
                <button onClick={closeCoach} className="flex items-center gap-1.5 rounded-full px-2 py-2 text-sm text-slate-500 transition hover:text-slate-900"><span className="text-lg leading-none">←</span> Quay lại</button>
                <div className="text-center">
                  <div className="text-sm font-semibold text-slate-800">🤖 Huấn luyện viên</div>
                  <div className="text-[11px] text-slate-400">Trò chuyện tự do bằng tiếng Trung</div>
                </div>
                <button onClick={closeCoach} className="grid h-10 w-10 place-items-center rounded-full text-slate-400 transition hover:bg-slate-100 hover:text-slate-700" aria-label="Đóng">✕</button>
              </div>
            </div>
            <div className="thin-scroll min-h-0 flex-1 overflow-y-auto overscroll-contain">
              <div className="mx-auto max-w-2xl space-y-5 px-6 py-8 md:px-10">
                {chat.length === 0 && <div className="py-16 text-center text-sm text-slate-400">Huấn luyện viên đang chuẩn bị chào bạn…</div>}
                {chat.map((m, i) => m.who === 'me' ? (
                  <div key={i} className="fade-in flex justify-end">
                    <div className="max-w-[80%] rounded-3xl rounded-br-lg bg-[#8fb5a0] px-5 py-3 text-base leading-relaxed text-white"><span className={CJK.test(m.text) ? 'zh' : ''}>{disp(m.text)}</span></div>
                  </div>
                ) : m.summary ? (
                  <div key={i} className="pop-in"><div className="gold-frame"><div className="rounded-[22px] bg-white px-6 py-5">
                    <div className="mb-3 flex items-center gap-2 text-sm font-semibold text-amber-600">📒 Tóm tắt bài học</div>
                    <CoachText text={m.text} />
                  </div></div></div>
                ) : (
                  <div key={i} className="fade-in flex justify-start">
                    <div className="max-w-[85%] rounded-3xl rounded-bl-lg bg-slate-100 px-5 py-4"><CoachText text={m.text} /></div>
                  </div>
                ))}
                {callState === 'thinking' && (
                  <div className="flex justify-start"><div className="flex gap-1.5 rounded-3xl rounded-bl-lg bg-slate-100 px-5 py-4">
                    {[0, 1, 2].map(i => <span key={i} className="h-2 w-2 animate-pulse rounded-full bg-slate-400" style={{ animationDelay: `${i * 0.2}s` }} />)}
                  </div></div>
                )}
                {(live || callState === 'transcribing') && (
                  <div className="flex justify-end"><div className="rounded-3xl rounded-br-lg border border-dashed border-[#8fb5a0] px-5 py-3 text-sm text-slate-400">{callState === 'transcribing' ? 'Đang nhận dạng…' : interim || '…'}</div></div>
                )}
                <div ref={chatEndRef} className="h-2" />
              </div>
            </div>
            <div className="flex-none border-t border-slate-200/60 bg-slate-50/90 backdrop-blur-xl" style={{ paddingBottom: 'calc(16px + env(safe-area-inset-bottom))' }}>
              <div className="mx-auto flex max-w-2xl flex-col items-center gap-3 px-6 pt-4">
                <div className={`text-center text-sm ${live ? 'font-medium text-emerald-600' : 'text-slate-500'}`}>{coachStatus}</div>
                <button onClick={handleCall} aria-label={coachBusy ? 'Kết thúc' : 'Trò chuyện lại'}
                  className={`relative grid h-16 w-16 place-items-center rounded-full text-white shadow-xl transition active:scale-95 ${!coachBusy || live ? 'bg-emerald-500' : 'bg-rose-500'}`}>
                  {live && <span className="ring-wave pointer-events-none absolute inset-0 rounded-full bg-emerald-400" />}
                  <PhoneIcon className={`relative h-7 w-7 transition-transform ${coachBusy ? 'rotate-[135deg]' : ''}`} />
                </button>
                <div className="text-[11px] text-slate-400">{coachBusy ? 'Bấm để kết thúc' : 'Bấm để trò chuyện lại'}</div>
              </div>
            </div>
          </div>,
          document.body
        );
      }

      return (
        <div className="fixed right-4 z-40 flex flex-col items-end gap-2 md:right-6" style={{ bottom }} onClick={e => e.stopPropagation()}>
          {callState !== 'idle' && voiceMode === 'guide' && current && (
            <div key={callState === 'correct' ? `ok-${current.sentence}` : 'card'} className={`morandi-flow fade-in w-[280px] rounded-2xl p-3.5 text-left shadow-[0_18px_50px_-12px_rgba(15,23,42,0.3)] ${callState === 'correct' ? 'exam-correct' : ''}`}>
              <div className="flex items-center justify-between gap-2">
                <span className={`text-xs font-medium ${live || callState === 'correct' ? 'text-emerald-600' : 'text-slate-500'}`}>{STATUS[callState]}</span>
                {streak > 1 && <span className="text-[11px] font-semibold text-amber-600">Đúng liên tiếp {streak}</span>}
              </div>
              <div className={`mt-2 rounded-xl px-3 py-2 ${callState === 'correct' ? 'bg-emerald-50' : 'bg-slate-50'}`}>
                <div className="flex justify-between text-xs text-slate-400"><span>Nói bằng tiếng Trung thế nào?</span><span>Ải {current.levelId}</span></div>
                <div className="text-base font-semibold leading-snug text-slate-900">{current.trans}</div>
                {(callState === 'guided' || callState === 'correct') && (
                  <>
                    <div className="zh mt-1 text-lg font-medium text-emerald-700">{disp(current.sentence)}</div>
                    <PhonSentence text={current.sentence} force />
                  </>
                )}
              </div>
              {interim && <div className="mt-2 text-sm text-slate-400">{interim}</div>}
              {!interim && last && last.heard && callState !== 'listening' && (
                <div className={`mt-2 text-sm ${last.score >= 0.8 ? 'text-emerald-600' : last.score >= 0.5 ? 'text-slate-600' : 'text-amber-600'}`}>
                  Bạn nói: <span className={CJK.test(last.heard) ? 'zh' : ''}>{disp(last.heard)}</span>・{Math.round(last.score * 100)}%
                </div>
              )}
              {live && <button onClick={askHelp} className="mt-2 w-full rounded-xl bg-amber-50 py-2 text-sm font-medium text-amber-700 transition hover:bg-amber-100">🆘 Tôi không biết, gợi ý giúp tôi</button>}
              {live && <div className="mt-1.5 text-[11px] leading-relaxed text-slate-400">Không nói được thì cứ nói tiếng Việt “không biết” hoặc “gợi ý”</div>}
            </div>
          )}
          <div className="flex items-center gap-2">
            {callState === 'idle' && (
              <div className="flex rounded-full bg-white p-1 text-xs font-medium shadow-lg">
                {[['guide', '💡 Theo bài'], ['coach', '🤖 Huấn luyện viên']].map(([k, label]) => (
                  <button key={k} onClick={() => setVoiceMode(k)} className={`rounded-full px-3 py-1.5 transition ${voiceMode === k ? 'bg-slate-900 text-white' : 'text-slate-500 hover:text-slate-800'}`}>{label}</button>
                ))}
              </div>
            )}
            <button onClick={handleCall} aria-label={callState === 'idle' ? 'Bắt đầu luyện nói' : 'Kết thúc'}
              title={callState === 'idle' ? 'Luyện nói: cô hỏi tiếng Việt, bạn trả lời tiếng Trung' : 'Kết thúc'}
              className={`relative grid h-14 w-14 place-items-center rounded-full transition active:scale-95 ${
                callState === 'idle' ? 'call-idle border border-slate-200 bg-white text-slate-700 shadow-xl hover:border-emerald-300 hover:text-emerald-600'
                  : live ? 'animate-pulse bg-emerald-500 text-white shadow-xl' : 'call-active text-white'}`}>
              {live && <span className="ring-wave pointer-events-none absolute inset-0 rounded-full bg-emerald-400" />}
              <PhoneIcon className={`relative h-6 w-6 transition-transform ${callState !== 'idle' ? 'rotate-[135deg]' : ''}`} />
            </button>
          </div>
        </div>
      );
    }

    /* =========================================================
       23. Chương trình chính
       ========================================================= */
    function App() {
      const isDesktop = useMediaQuery('(min-width: 1024px)');

      /* Phồn thể / giản thể: cập nhật SCRIPT trước khi các thành phần con render */
      const [script, setScript] = useLocalStorage('zhl.script', 'trad');
      SCRIPT.mode = script === 'simp' ? 'simp' : 'trad';
      useEffect(() => { document.documentElement.classList.toggle('simp', script === 'simp'); }, [script]);
      /* Phiên âm: bính âm / chú âm / cả hai / ẩn */
      const [phonetic, setPhonetic] = useLocalStorage('zhl.phonetic', 'pinyin');
      PHONETIC.mode = ['pinyin', 'zhuyin', 'both', 'off'].includes(phonetic) ? phonetic : 'pinyin';
      const showPy = PHONETIC.mode !== 'off';
      /* Thư viện OpenCC / pinyin-pro tải bất đồng bộ: render lại khi tải xong */
      const [, setLibTick] = useState(0);
      useEffect(() => {
        let n = 0;
        const t = setInterval(() => { n++; if (window.OpenCC || n > 20) { setLibTick(x => x + 1); clearInterval(t); } }, 500);
        return () => clearInterval(t);
      }, []);

      const [input, setInput] = useState('');
      const [result, setResult] = useState(null);           // { zh, vi, words }
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [openIdx, setOpenIdx] = useState(null);
      const [lookups, setLookups] = useState({});
      const [mainTab, setMainTab] = useState('translate');
      const mainRef = useRef(null);

      const [unlockedChapters, setUnlockedChapters] = useLocalStorage('zhl.campaign.unlocked', DEFAULT_UNLOCKED);
      const [levelProgress, setLevelProgress] = useLocalStorage('zhl.campaign.progress', {});
      const [runningLevel, setRunningLevel] = useLocalStorage('zhl.campaign.running', null);
      const [replayLevel, setReplayLevel] = useState(false);
      const [runningMode, setRunningMode] = useLocalStorage('zhl.campaign.runningMode', 1);
      const [levelStars, setLevelStars] = useLocalStorage('zhl.levelStars', {});
      const [practiceTab, setPracticeTab] = useLocalStorage('zhl.practiceTab', 'campaign');
      const [chapterExam, setChapterExam] = useLocalStorage('zhl.chapterExam', {});
      const [bossChapter, setBossChapter] = useState(null);

      const [isDarkMode, setIsDarkMode] = useLocalStorage('zhl.darkMode', false);
      useEffect(() => {
        document.documentElement.classList.toggle('dark', !!isDarkMode);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isDarkMode ? '#09090b' : '#f8fafc');
      }, [isDarkMode]);
      const toggleTheme = () => {
        const root = document.documentElement;
        root.classList.add('theme-anim');
        setIsDarkMode(v => !v);
        setTimeout(() => root.classList.remove('theme-anim'), 450);
      };

      const [widgetOpen, setWidgetOpen] = useState(false);
      const [, setClockTick] = useState(0);
      useEffect(() => { const t = setInterval(() => setClockTick(x => x + 1), 60000); return () => clearInterval(t); }, []);
      const clockNow = Date.now();
      const [toast, setToast] = useState('');
      const [listening, setListening] = useState(false);
      const [interim, setInterim] = useState('');

      const voiceInfo = useChineseVoices();
      const [voiceOpen, setVoiceOpen] = useState(false);
      const [toneFlash, setToneFlash] = useState(null);
      const [guideTab, setGuideTab] = useLocalStorage('zhl.guideTab', 'pinyin');
      const [guideOpen, setGuideOpen] = useState(false);
      const [libraryTabRaw, setLibraryTab] = useLocalStorage('zhl.libraryTab', 'beginner');
      const libraryTab = OFFICIAL_LIBRARY[libraryTabRaw] ? libraryTabRaw : ((LIBRARY_TABS[0] || [])[0] || '');
      const [libraryPages, setLibraryPages] = useState(() => Object.fromEntries(Object.keys(OFFICIAL_LIBRARY).map(k => [k, drawLibraryPage(k)])));
      const [libraryFading, setLibraryFading] = useState(false);
      const [librarySpin, setLibrarySpin] = useState(0);
      const [libraryNonce, setLibraryNonce] = useState(0);
      const refreshLibrary = () => {
        if (libraryFading) return;
        setLibrarySpin(d => d + 360);
        setLibraryFading(true);
        setTimeout(() => {
          setLibraryPages(prev => ({ ...prev, [libraryTab]: drawLibraryPage(libraryTab, prev[libraryTab] || []) }));
          setLibraryNonce(n => n + 1);
          setLibraryFading(false);
        }, 160);
      };
      const [letterFlash, setLetterFlash] = useState(null);
      const lookupsRef = useRef({});
      const chipRefs = useRef([]);
      const toneCellRefs = useRef({});
      const recRef = useRef(null);
      const toastTimer = useRef(null);

      /* Bộ sưu tập + số lần gặp */
      const [store, setStore] = useState(loadInitialStore);
      useEffect(() => { try { localStorage.setItem('zhl.store', JSON.stringify(store)); } catch (e) {} }, [store]);
      const sentences = useMemo(() => viewSentences(store), [store]);
      const words = useMemo(() => viewWords(store), [store]);
      const hits = useMemo(() => viewHits(store), [store]);

      const setSentences = upd => setStore(prev => {
        const before = viewSentences(prev);
        const after = typeof upd === 'function' ? upd(before) : upd;
        if (after === before) return prev;
        const now = Date.now();
        const next = { ...prev, sentences: { ...prev.sentences } };
        const keep = new Set(after.map(x => x.zh));
        before.forEach(x => { if (!keep.has(x.zh)) next.sentences[x.zh] = { ...prev.sentences[x.zh], deleted: true, updatedAt: now }; });
        after.forEach(x => {
          const old = prev.sentences[x.zh];
          if (!alive(old, prev) || old.vi !== x.vi) next.sentences[x.zh] = { zh: x.zh, vi: x.vi, savedAt: alive(old, prev) ? old.savedAt : now, updatedAt: now, deleted: false };
        });
        return next;
      });
      const setWords = upd => setStore(prev => {
        const before = viewWords(prev);
        const after = typeof upd === 'function' ? upd(before) : upd;
        if (after === before) return prev;
        const now = Date.now();
        const next = { ...prev, words: { ...prev.words } };
        let changed = false;
        Object.keys(before).forEach(k => { if (!after[k]) { next.words[k] = { ...prev.words[k], deleted: true, updatedAt: now }; changed = true; } });
        Object.entries(after).forEach(([k, w]) => {
          const b = before[k];
          if (!b || b.meaning !== w.meaning || b.pos !== w.pos || b.reviewedAt !== w.reviewedAt) {
            next.words[k] = { word: k, meaning: w.meaning || '', pos: w.pos, savedAt: b ? b.savedAt : now, reviewedAt: w.reviewedAt || (b ? b.reviewedAt : now), updatedAt: now, deleted: false };
            changed = true;
          }
        });
        return changed ? next : prev;
      });
      const setHits = upd => setStore(prev => {
        const before = viewHits(prev);
        const after = typeof upd === 'function' ? upd(before) : upd;
        const now = Date.now();
        if (Object.keys(after).length === 0) return { ...prev, clearedAt: now, hits: { ...prev.hits, [DEVICE_ID]: { since: now, counts: {} } } };
        const cur = prev.hits[DEVICE_ID];
        const mine = cur && (cur.since || 0) >= (prev.clearedAt || 0) ? cur : { since: prev.clearedAt || 0, counts: {} };
        const counts = { ...mine.counts };
        let changed = false;
        Object.entries(after).forEach(([k, n]) => { const d = n - (before[k] || 0); if (d > 0) { counts[k] = (counts[k] || 0) + d; changed = true; } });
        return changed ? { ...prev, hits: { ...prev.hits, [DEVICE_ID]: { since: mine.since, counts } } } : prev;
      });

      /* 📡 Đồng bộ */
      const [syncConfig, setSyncConfig] = useLocalStorage(SYNC_KEY, { roomId: '', enabled: false });
      const [syncState, setSyncState] = useState({ status: 'idle', at: null, message: '' });
      const [syncOpen, setSyncOpen] = useState(false);
      const latestRef = useRef({});
      const syncConfigRef = useRef(syncConfig);
      syncConfigRef.current = syncConfig;
      const syncingRef = useRef(false);
      const pendingRef = useRef(false);
      const lastSyncedRef = useRef(null);

      const buildBundle = () => {
        const L = latestRef.current;
        return {
          v: 'zh1', store: L.store, levelStars: L.levelStars || {}, levelProgress: L.levelProgress || {},
          unlocked: L.unlockedChapters || [1], chapterExam: L.chapterExam || {}, phrases: readLS('zhl.phrases', []),
        };
      };
      const applyBundle = m => {
        setStore(cur => mergeStores(cur, m.store));
        setLevelStars(cur => mergeLevelStars(cur, m.levelStars));
        setLevelProgress(cur => mergeLevelProgress(cur, m.levelProgress));
        setUnlockedChapters(cur => unionSorted(cur, m.unlocked).map(Number));
        setChapterExam(cur => mergeChapterExam(cur, m.chapterExam));
        try { localStorage.setItem('zhl.phrases', JSON.stringify(m.phrases)); } catch (e) {}
      };
      const runSync = async cfgOverride => {
        const cfg = cfgOverride || syncConfigRef.current;
        if (!syncReady() || !cfg.enabled || !validRoom(cfg.roomId)) return;
        if (syncingRef.current) { pendingRef.current = true; return; }
        syncingRef.current = true;
        setSyncState(st => ({ ...st, status: 'syncing' }));
        try {
          const res = await roomGet(cfg.roomId);
          const remote = res && res.data;
          const local = buildBundle();
          const merged = mergeBundles(local, remote);
          const mergedJson = stable(merged);
          if (mergedJson !== stable(local)) applyBundle(merged);
          if (!remote || remote.v !== 'zh1' || mergedJson !== stable(remote)) await roomPut(cfg.roomId, merged);
          lastSyncedRef.current = mergedJson;
          setSyncState({ status: 'ok', at: Date.now(), message: '' });
        } catch (e) {
          setSyncState({ status: 'error', at: null, message: e.message });
        } finally {
          syncingRef.current = false;
          if (pendingRef.current) { pendingRef.current = false; setTimeout(() => runSyncRef.current(), 300); }
        }
      };
      const runSyncRef = useRef(runSync);
      runSyncRef.current = runSync;
      useEffect(() => {
        const trigger = () => { if (document.visibilityState === 'visible') runSyncRef.current(); };
        trigger();
        document.addEventListener('visibilitychange', trigger);
        window.addEventListener('online', trigger);
        const poll = setInterval(trigger, 15000);
        return () => { document.removeEventListener('visibilitychange', trigger); window.removeEventListener('online', trigger); clearInterval(poll); };
      }, []);

      const notify = msg => {
        setToast(msg);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(''), 2600);
      };
      const createPair = async () => {
        let cfg = syncConfigRef.current;
        if (!validRoom(cfg.roomId) || !cfg.enabled) {
          cfg = { roomId: validRoom(cfg.roomId) ? cfg.roomId : newRoomId(), enabled: true };
          setSyncConfig(cfg);
          syncConfigRef.current = cfg;
          await runSync(cfg);
        }
        const r = await pairCreate(cfg.roomId);
        return { code: r.code, expiresAt: Date.now() + (r.ttl || 600) * 1000 };
      };
      const joinRoom = async roomId => {
        const cfg = { roomId, enabled: true };
        setSyncConfig(cfg);
        syncConfigRef.current = cfg;
        await runSync(cfg);
        notify('📡 Ghép nối xong! Tiến độ của hai thiết bị đã được gộp');
      };
      const claimPair = async code => {
        const r = await pairClaim(code);
        if (!r || !validRoom(r.roomId)) throw new Error('Mã ghép nối sai hoặc đã hết hạn');
        await joinRoom(r.roomId);
      };
      const unpair = () => {
        if (!confirm('Hủy đồng bộ tự động trên thiết bị này? Tiến độ trên máy vẫn được giữ lại.')) return;
        setSyncConfig({ roomId: '', enabled: false });
        syncConfigRef.current = { roomId: '', enabled: false };
        setSyncState({ status: 'idle', at: null, message: '' });
        setSyncOpen(false);
        notify('Đã hủy đồng bộ, dữ liệu trên máy vẫn còn');
      };
      useEffect(() => {
        const m = window.location.hash.match(/^#pair=([A-Za-z0-9_-]{20,64})$/);
        if (!m) return;
        history.replaceState(null, '', window.location.pathname + window.location.search);
        if (!syncReady()) { notify('Trang này chưa cài máy chủ đồng bộ'); return; }
        if (syncConfigRef.current.enabled && syncConfigRef.current.roomId === m[1]) { notify('Thiết bị này đang đồng bộ rồi'); return; }
        if (!confirm('Cho thiết bị này tham gia đồng bộ tự động?\nTiến độ của hai thiết bị sẽ được gộp và tiếp tục đồng bộ ở chế độ nền.')) return;
        joinRoom(m[1]);
      }, []);

      const [voiceLang, setVoiceLang] = useLocalStorage('zhl.voiceLang', 'zh-TW');

      useEffect(() => {
        const close = () => setOpenIdx(null);
        document.addEventListener('click', close);
        return () => document.removeEventListener('click', close);
      }, []);
      useEffect(() => { if (isDesktop && mainTab === 'collection') setMainTab('translate'); }, [isDesktop]);

      const scrollToTop = () => {
        if (!isDesktop && mainRef.current) mainRef.current.scrollTo({ top: 0, behavior: 'smooth' });
        else window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      const updateLookup = (key, value) => { lookupsRef.current = { ...lookupsRef.current, [key]: value }; setLookups(lookupsRef.current); };
      const countWords = wordArr => {
        const keys = [...new Set(wordArr.map(keyOf).filter(k => k && CJK.test(k)))];
        setHits(prev => { const next = { ...prev }; keys.forEach(k => { next[k] = (next[k] || 0) + 1; }); return next; });
      };

      /* Dịch và phân tích: trả về { zh, vi } (lỗi trả về null)
         known: nghĩa tiếng Việt đã biết (câu trong thư viện, không tốn lượt dịch) */
      const handleTranslate = async (value, known) => {
        const text = (value ?? input).trim();
        if (!text) { setError('Hãy nhập một câu tiếng Việt hoặc tiếng Trung'); return null; }
        if (text.length > 200) { setError('Mỗi lần dịch tối đa 200 ký tự, hãy rút ngắn câu'); return null; }
        setInput(text);
        setLoading(true);
        setError('');
        setOpenIdx(null);
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        try {
          let zh, vi;
          if (known) { zh = toTW(text); vi = known; }
          else if (CJK.test(text)) { zh = toTW(text); vi = await translate(zh, 'zh-TW', 'vi'); }
          else { vi = text; zh = await translate(text, 'vi', 'zh-TW'); }
          const segs = segment(zh).filter(w => stripPunct(w));
          setResult({ zh, vi, words: segs });
          countWords(segs);
          return { zh, vi };
        } catch (e) {
          setError(e.message);
          return null;
        } finally {
          setLoading(false);
        }
      };

      const [speakIdx, setSpeakIdx] = useState(null);
      const [duetMask, setDuetMask] = useState(null);   // ẩn đáp án khi luyện nói
      const loadDuetSentence = async (item, { hidden = false } = {}) => {
        setMainTab('translate');
        setRunningLevel(null);
        setOpenIdx(null);
        await handleTranslate(item.sentence, item.trans);
        if (hidden) {
          const n = segment(item.sentence).filter(w => stripPunct(w)).length;
          let order = Array.from({ length: n }, (_, i) => i);
          if (n > 1) { let t = 0; do { order = shuffle(order); t++; } while (t < 20 && order.every((x, i) => x === i)); }
          setDuetMask({ zh: toTW(item.sentence), order });
          setInput(item.trans);
        } else setDuetMask(null);
        setTimeout(() => { const el = document.getElementById('zhl-results'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 120);
      };
      const revealDuet = () => setDuetMask(null);
      const masked = !!(duetMask && result && duetMask.zh === result.zh);

      const toggleVoice = () => {
        if (!SR) { setError('Trình duyệt này không hỗ trợ nhận dạng giọng nói. Máy tính hãy dùng Chrome hoặc Edge, Android dùng Chrome, iPhone dùng Safari.'); return; }
        if (recRef.current) { recRef.current.stop(); return; }
        const rec = new SR();
        rec.lang = lockLang(voiceLang);
        rec.interimResults = true;
        rec.continuous = false;
        rec.maxAlternatives = 1;
        let finalText = '', failed = false;
        rec.onresult = e => {
          let live = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (r.isFinal) finalText += r[0].transcript; else live += r[0].transcript;
          }
          setInterim((finalText + live).trim());
        };
        rec.onerror = e => { failed = true; setError(speechErrorText(e.error)); };
        rec.onend = () => {
          recRef.current = null;
          setListening(false);
          setInterim('');
          const text = finalText.trim();
          if (failed) return;
          if (!text) { setError('Chưa nghe được câu hoàn chỉnh, hãy thử lại'); return; }
          handleTranslate(CJK.test(text) ? toTW(text) : text);
        };
        try { rec.start(); recRef.current = rec; setListening(true); setError(''); setInterim(''); }
        catch (err) { setError('Không khởi động được micro, hãy thử lại sau'); }
      };

      /* Tra từ: từ điển có sẵn → nghĩa đã lưu → dịch trực tuyến */
      const lookupWord = async (word, force = false) => {
        const key = keyOf(word);
        if (!key) return;
        const entry = DICT[key];
        if (entry && entry.vi) {
          updateLookup(key, { status: 'done', text: entry.vi, source: 'Từ điển có sẵn' });
          setWords(prev => (prev[key] && prev[key].meaning !== entry.vi ? { ...prev, [key]: { ...prev[key], meaning: entry.vi } } : prev));
          return;
        }
        const cached = lookupsRef.current[key];
        if (!force && cached && cached.status !== 'error') return;
        if (!force && words[key] && words[key].meaning) { updateLookup(key, { status: 'done', text: words[key].meaning, source: 'Đã lưu' }); return; }
        updateLookup(key, { status: 'loading' });
        try {
          const text = await translate(key, 'zh-TW', 'vi');
          updateLookup(key, { status: 'done', text, source: 'Dịch trực tuyến' });
          setWords(prev => (prev[key] && !prev[key].meaning ? { ...prev, [key]: { ...prev[key], meaning: text } } : prev));
        } catch (e) {
          updateLookup(key, { status: 'error', message: e.message });
        }
      };

      const handleChipClick = (i, word) => {
        const next = openIdx === i ? null : i;
        setOpenIdx(next);
        if (next !== null) { lookupWord(word); speak(word); }
      };
      /* Lưu từ từ thẻ từ vựng (data.json) */
      const saveDeckWord = w => {
        const key = w.chinese;
        const already = !!words[key];
        setWords(prev => ({ ...prev, [key]: already ? { ...prev[key], meaning: prev[key].meaning || w.vietnamese } : { word: key, meaning: w.vietnamese, pos: w.pos, savedAt: Date.now() } }));
        setHits(prev => ({ ...prev, [key]: already ? (prev[key] || 1) + 1 : Math.max(prev[key] || 0, 1) }));
        if (!isDesktop) notify(already ? `“${disp(key)}” +1 lần` : `Đã lưu “${disp(key)}” vào bộ sưu tập`);
      };
      const saveWord = (word, pos) => {
        const key = keyOf(word);
        const lk = lookupsRef.current[key];
        const meaning = (DICT[key] || {}).vi || (lk && lk.status === 'done' ? lk.text : '');
        const already = !!words[key];
        setWords(prev => ({
          ...prev,
          [key]: already ? { ...prev[key], pos, meaning: prev[key].meaning || meaning } : { word: key, meaning, pos, savedAt: Date.now() },
        }));
        setHits(prev => ({ ...prev, [key]: already ? (prev[key] || 1) + 1 : Math.max(prev[key] || 0, 1) }));
        if (!isDesktop) notify(already ? `“${disp(key)}” +1 lần` : `Đã lưu “${disp(key)}” vào bộ sưu tập`);
      };
      const flashTone = id => {
        setGuideTab('tones');
        setGuideOpen(true);
        setToneFlash({ id, n: Date.now() });
        setTimeout(() => {
          const el = toneCellRefs.current[id];
          if (!el) return;
          const r = el.getBoundingClientRect();
          if (r.top < 72 || r.bottom > window.innerHeight) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 60);
      };
      const playPinyin = item => { setLetterFlash({ id: item.id, n: Date.now() }); speak(item.say === item.ex ? [item.say] : [item.say, item.ex], 0.75); };
      const setWordPos = (key, pos) => setWords(prev => (prev[key] ? { ...prev, [key]: { ...prev[key], pos } } : prev));

      const savedSentence = result && sentences.find(s => s.zh === result.zh);
      const toggleSentence = () => {
        if (!result) return;
        if (savedSentence) { setSentences(prev => prev.filter(s => s.id !== savedSentence.id)); if (!isDesktop) notify('Đã bỏ lưu'); }
        else { setSentences(prev => [{ id: result.zh, zh: result.zh, vi: result.vi, savedAt: Date.now() }, ...prev]); if (!isDesktop) notify('Đã lưu vào câu vàng'); }
      };
      const openSentence = s => {
        setResult({ zh: s.zh, vi: s.vi, words: segment(s.zh).filter(w => stripPunct(w)) });
        setError(''); setOpenIdx(null); setMainTab('translate'); scrollToTop();
      };
      const clearAll = () => {
        if (!confirm('Xóa toàn bộ câu, từ đã lưu và số lần gặp? Thao tác này không thể hoàn tác.')) return;
        setSentences([]); setWords({}); setHits({});
      };

      const levelById = id => ALL_LEVELS.find(lv => lv.id === id) || null;
      const startLevel = (lv, mode = 1) => {
        const cleared = levelStatus(lv, levelProgress[lv.id]) === 'cleared';
        setReplayLevel(mode !== 1 || cleared);
        setRunningMode(mode);
        setRunningLevel(lv.id);
        if (mode === 3) speak(lv.questions[0].sentence);
        setMainTab('translate'); setOpenIdx(null); scrollToTop();
      };
      const updateLevel = (id, updater) => {
        setLevelProgress(prev => {
          const lv = levelById(id);
          const cur = prev[id] || {};
          const nextLv = updater(cur);
          if (lv && !cur.clearedAt && lv.questions.every((_, i) => nextLv.done && nextLv.done[i])) {
            nextLv.clearedAt = Date.now();
            setTimeout(() => notify(`✅ Đã qua ải ${id} “${lv.name}”!`), 0);
          }
          return { ...prev, [id]: nextLv };
        });
      };
      const completeRun = (id, mode) => {
        const now = Date.now();
        const cur = levelStars[id] || {};
        const before = starsOf(cur);
        const cracked = isCracked(cur, now);
        const repair = !cracked || mode === 3;
        setLevelStars(prev => {
          const c = prev[id] || {};
          return { ...prev, [id]: { ...c, stars: Math.max(starsOf(c), mode), reviewedAt: repair ? now : c.reviewedAt, earnedAt: { ...(c.earnedAt || {}), [mode]: (c.earnedAt || {})[mode] || now } } };
        });
        if (cracked && mode === 3) notify(`✨ Đã sửa xong pha lê ma thuật của ải ${id}!`);
        else if (mode > before) notify(mode === 3 ? `🏆 Ải ${id} đạt 3 sao tối đa!` : `⭐ Ải ${id} nhận sao thứ ${mode}!`);
        else if (cracked) notify('💢 Ải này vẫn đang nứt, phải chơi “Chỉ nghe” mới sửa được');
      };

      const levelStates = useMemo(() => computeLevelStates(levelProgress, unlockedChapters), [levelProgress, unlockedChapters]);
      const nextLevelOf = id => {
        const cur = levelProgress[id] || {};
        const assumed = computeLevelStates({ ...levelProgress, [id]: { ...cur, clearedAt: cur.clearedAt || Date.now() } }, unlockedChapters);
        const i = PLAYABLE_LEVELS.findIndex(lv => lv.id === id);
        return PLAYABLE_LEVELS.slice(i + 1).find(lv => assumed[lv.id] === 'open' || assumed[lv.id] === 'active') || null;
      };
      const finishBoss = ({ chapterId, score, perfect }) => {
        const now = Date.now();
        setChapterExam(prev => {
          const c = prev[chapterId] || {};
          return { ...prev, [chapterId]: { best: Math.max(c.best || 0, score), attempts: (c.attempts || 0) + 1, passedAt: c.passedAt || (perfect ? now : undefined) } };
        });
        if (!perfect) return;
        const i = CAMPAIGN.findIndex(c => c.id === chapterId);
        const nextCh = CAMPAIGN[i + 1];
        if (nextCh && !unlockedChapters.includes(nextCh.id)) {
          setUnlockedChapters(prev => (prev.includes(nextCh.id) ? prev : [...prev, nextCh.id].sort()));
          notify(`🔓 Đã mở khóa ${nextCh.name} “${nextCh.title}”!`);
        }
      };

      const widgetItems = useMemo(() =>
        Object.values(words)
          .map(w => ({
            word: w.word,
            py: [pinyinWord(w.word), zhuyinWord(w.word)].filter(Boolean).join('  ·  '),
            meaning: firstMeaning(w.meaning) || firstMeaning((DICT[w.word] || {}).vi) || '—',
            hits: Math.max(hits[w.word] || 0, 1),

                              </div>

    /* =========================================================
       24. Khởi động: tải data.json trước, sau đó mới hiện App
       ========================================================= */
    function Boot() {
      const [state, setState] = useState({ status: 'loading', message: '' });
      const load = async () => {
        setState({ status: 'loading', message: '' });
        try {
          const { json, source, stale } = await loadCurriculum();
          applyCurriculum(json, source, stale);
          if (!WORDS.length) throw new Error('data.json không có từ hợp lệ (mỗi từ cần ít nhất "chinese" và "pinyin")');
          setState({ status: 'ready', message: '' });
        } catch (e) {
          setState({ status: 'error', message: e.message });
        }
      };
      useEffect(() => { load(); }, []);
      if (state.status === 'ready') return <App />;
      return (
        <div className="grid min-h-screen place-items-center bg-slate-50 px-6">
          <div className="w-full max-w-md text-center">
            <div className="zh mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-emerald-500 text-2xl font-bold text-white shadow-md">漢</div>
            {state.status === 'loading' ? (
              <div className="mt-5 flex items-center justify-center gap-2 text-sm text-slate-500"><Spinner /> Đang tải giáo trình…</div>
            ) : (
              <>
                <h1 className="mt-5 text-lg font-semibold text-slate-800">Không tải được giáo trình</h1>
                <p className="mt-2 text-sm leading-relaxed text-slate-500">Hãy kiểm tra kết nối mạng, hoặc địa chỉ DATA_URL trong index.html phải là đường dẫn raw của data.json trên GitHub.</p>
                <pre className="mt-4 whitespace-pre-wrap rounded-xl bg-white px-4 py-3 text-left text-xs text-rose-600 shadow-sm">{state.message}</pre>
                <button onClick={load} className="mt-5 rounded-xl bg-slate-900 px-6 py-3 text-sm font-semibold text-white">Thử lại</button>
              </>
            )}
          </div>
        </div>
      );
    }

    root.render(<Boot />);
  </script>
</body>
</html>
