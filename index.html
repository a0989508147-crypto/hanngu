    /* 📞 Nút luyện nói */

<body class="bg-slate-50 text-slate-800">
  <div id="root">
    <p style="padding:48px 24px;text-align:center;color:#64748b;font-family:sans-serif">
      Đang tải… Nếu dừng ở đây quá lâu, hãy kiểm tra kết nối mạng.
    </p>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useLayoutEffect, useRef, useMemo } = React;

    /* =========================================================
       1. Hooks dùng chung
       ========================================================= */
    function useLocalStorage(key, initialValue) {
      const [value, setValue] = useState(() => {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : initialValue;
        } catch (e) {
          return initialValue;
        }
      });
      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* bộ nhớ đầy hoặc bị tắt */ }
      }, [key, value]);
      return [value, setValue];
    }

    function useMediaQuery(query) {
      const [matches, setMatches] = useState(() => window.matchMedia(query).matches);
      useEffect(() => {
        const mq = window.matchMedia(query);
        const handler = e => setMatches(e.matches);
        setMatches(mq.matches);
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, [query]);
      return matches;
    }

    /* =========================================================
       2. Chữ Hán: nhận diện, phồn thể ⇄ giản thể
       Dữ liệu trong app lưu bằng PHỒN THỂ (chuẩn Đài Loan);
       người dùng có thể chuyển sang hiển thị GIẢN THỂ bằng nút 繁/简 ở thanh trên cùng.
       ========================================================= */
    const CJK = /[\u3400-\u9fff\uf900-\ufaff]/;
    const isChinese = s => CJK.test(String(s || ''));

    const S2T_SIMP = '这个们来时说话语问题请谢对错误译还没关见电视学习吗么为样当长东车门间经过国会动现实开头发点钱买卖饭汤鸡鱼猪条热远听读写记忆练认识进难简单复杂总结报词汇应该觉让给帮谁儿边场机飞节号码钟环历帐继续选择声调标准确际虽从后里张颗块双轮级数线网络软务业产农厂区县乡镇广华汉欢乐爱气体脑讲谈论试验讯赞优势处办种类惯礼态换将带着爷妈孙亲岁计划备齐盘饮咸价贵银购裤红绿蓝黄颜铁游馆医药烧周庆运书笔纸画课师测离楼层灯邮够达惊讶释义组织构规则范纠轻夸奖励归纳盖页顺畅补阶项览满适舍尽怀赶紧卫厕纪录讨厌愿辈闻极积压质资预顾尝证赛胜败输赢担忧虑却刚丽帅闹静仅并与于无';
    const S2T_TRAD = '這個們來時說話語問題請謝對錯誤譯還沒關見電視學習嗎麼為樣當長東車門間經過國會動現實開頭發點錢買賣飯湯雞魚豬條熱遠聽讀寫記憶練認識進難簡單複雜總結報詞彙應該覺讓給幫誰兒邊場機飛節號碼鐘環歷帳繼續選擇聲調標準確際雖從後裡張顆塊雙輪級數線網絡軟務業產農廠區縣鄉鎮廣華漢歡樂愛氣體腦講談論試驗訊讚優勢處辦種類慣禮態換將帶著爺媽孫親歲計劃備齊盤飲鹹價貴銀購褲紅綠藍黃顏鐵遊館醫藥燒週慶運書筆紙畫課師測離樓層燈郵夠達驚訝釋義組織構規則範糾輕誇獎勵歸納蓋頁順暢補階項覽滿適捨盡懷趕緊衛廁紀錄討厭願輩聞極積壓質資預顧嘗證賽勝敗輸贏擔憂慮卻剛麗帥鬧靜僅並與於無';
    const S2T_MAP = {}, T2S_MAP = {};
    for (let i = 0; i < Math.min(S2T_SIMP.length, S2T_TRAD.length); i++) {
      S2T_MAP[S2T_SIMP[i]] = S2T_TRAD[i];
      T2S_MAP[S2T_TRAD[i]] = S2T_SIMP[i];
    }
    /* Một số chữ thường gặp trong bài học mà bảng trên chưa có */
    Object.entries({ '鹅': '鵝', '饿': '餓', '贵': '貴', '么': '麼', '机': '機', '厅': '廳', '吗': '嗎', '汤': '湯', '匙': '匙', '筷': '筷', '肉': '肉', '面': '麵', '笼': '籠', '卤': '滷', '奶': '奶', '鲜': '鮮', '苹': '蘋', '旧': '舊', '净': '淨', '袋': '袋', '订': '訂', '间': '間', '转': '轉', '启': '啟', '潜': '潛', '挑': '挑', '战': '戰', '决': '決', '响': '響', '环': '環', '责': '責', '护': '護', '变': '變', '耐': '耐', '毅': '毅', '尝': '嘗', '试': '試', '盐': '鹽', '脏': '髒', '么': '麼', '妈': '媽', '哥': '哥', '岁': '歲', '饭': '飯', '鸡': '雞', '鱼': '魚', '虾': '蝦', '馆': '館', '递': '遞', '拿': '拿', '铁': '鐵', '烦': '煩', '帐': '帳', '担': '擔', '迷': '迷', '决': '決', '惯': '慣', '东': '東', '车': '車', '冲': '衝' })
      .forEach(([s, t]) => { if (s !== t) { S2T_MAP[s] = S2T_MAP[s] || t; T2S_MAP[t] = T2S_MAP[t] || s; } });

    let ccToTW = null, ccToCN = null;
    function initOpenCC() {
      if (ccToTW || !window.OpenCC || !window.OpenCC.Converter) return;
      try {
        ccToTW = window.OpenCC.Converter({ from: 'cn', to: 'tw' });
        ccToCN = window.OpenCC.Converter({ from: 'tw', to: 'cn' });
      } catch (e) { ccToTW = ccToCN = null; }
    }
    /* Đưa văn bản về PHỒN THỂ (dữ liệu chuẩn trong app) */
    function toTW(text) {
      const s = String(text || '');
      if (!CJK.test(s)) return s;
      initOpenCC();
      try { if (ccToTW) return ccToTW(s); } catch (e) { /* dùng bảng có sẵn */ }
      let out = s.replace(/[\u3400-\u9fff]/g, ch => S2T_MAP[ch] || ch);
      [['公裡', '公里'], ['裡程', '里程'], ['頭發', '頭髮'], ['理發', '理髮'], ['關系', '關係'], ['聯系', '聯繫']].forEach(([a, b]) => { out = out.split(a).join(b); });
      return out;
    }
    /* Đưa văn bản về GIẢN THỂ (chỉ dùng để hiển thị và đọc bính âm) */
    function toCN(text) {
      const s = String(text || '');
      if (!CJK.test(s)) return s;
      initOpenCC();
      try { if (ccToCN) return ccToCN(s); } catch (e) { /* dùng bảng có sẵn */ }
      return s.replace(/[\u3400-\u9fff\uf900-\ufaff]/g, ch => T2S_MAP[ch] || ch);
    }

    /* Chế độ hiển thị chữ: 'trad' phồn thể / 'simp' giản thể (App cập nhật mỗi lần render) */
    const SCRIPT = {
      mode: (() => { try { return JSON.parse(localStorage.getItem('zhl.script')) === 'simp' ? 'simp' : 'trad'; } catch (e) { return 'trad'; } })(),
    };
    const disp = t => (SCRIPT.mode === 'simp' ? toCN(t) : String(t || ''));
    /* Dạng chữ còn lại (để ghi chú “繁: … / 简: …”), trả về '' nếu hai dạng giống nhau */
    const altForm = t => {
      const trad = toTW(t), simp = toCN(t);
      if (trad === simp) return '';
      return SCRIPT.mode === 'simp' ? trad : simp;
    };

    /* Chuẩn hóa: bỏ dấu câu, ký tự vô hình; chữ Hán đưa về phồn thể */
    const clean = w => String(w || '')
      .normalize('NFC')
      .replace(/[^\p{L}\p{M}\p{N}\s]/gu, '')
      .toLowerCase()
      .replace(/\s+/g, ' ')
      .trim();
    const keyOf = w => toTW(clean(w)).replace(/\s+/g, '');
    const stripPunct = t => String(t || '').replace(/[.,!?…;:"“”'，。？！、；：「」『』（）()～~—]+/g, '').trim();

    /* =========================================================
       3. Dịch tự động (MyMemory miễn phí, dự phòng Google)
       ========================================================= */
    const decodeEntities = s => {
      const el = document.createElement('textarea');
      el.innerHTML = s;
      return el.value;
    };

    async function fetchJSON(url, ms = 10000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        if (!res.ok) throw new Error(`Dịch vụ dịch báo lỗi (HTTP ${res.status})`);
        return await res.json();
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('Dịch vụ dịch phản hồi quá chậm, hãy thử lại');
        if (e instanceof TypeError) throw new Error('Không kết nối được dịch vụ dịch, hãy kiểm tra mạng');
        throw e;
      } finally {
        clearTimeout(timer);
      }
    }

    /* Kiểm tra kết quả có đúng ngôn ngữ đích: tiếng Trung phải có chữ Hán, tiếng Việt thì không */
    const looksRight = (out, to, source) => {
      if (!out || clean(out) === clean(source)) return false;
      return to.startsWith('zh') ? isChinese(out) : !isChinese(out) && /[a-zA-ZÀ-ỹđĐ]/.test(out);
    };

    async function myMemory(text, from, to) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
      const data = await fetchJSON(url);
      if (Number(data.responseStatus) !== 200) throw new Error(data.responseDetails || 'Dịch vụ dịch không trả về kết quả');
      const main = decodeEntities((data.responseData && data.responseData.translatedText) || '').trim();
      if (/MYMEMORY WARNING/i.test(main)) throw new Error('Đã hết lượt dịch miễn phí hôm nay, ngày mai sẽ tự khôi phục');
      if (looksRight(main, to, text)) return main;
      const candidates = (data.matches || [])
        .map(m => ({ text: decodeEntities(m.translation || '').trim(), score: Number(m.match) || 0 }))
        .filter(m => looksRight(m.text, to, text))
        .sort((a, b) => b.score - a.score);
      return candidates.length ? candidates[0].text : null;
    }

    async function googleGtx(text, from, to) {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
      const data = await fetchJSON(url);
      const out = (data[0] || []).map(seg => seg[0] || '').join('').trim();
      return looksRight(out, to, text) ? out : null;
    }

    /* Hàm dịch chính: tiếng Trung đầu ra luôn đưa về phồn thể */
    async function translate(text, from, to) {
      let lastError = null;
      for (const provider of [myMemory, googleGtx]) {
        try {
          const out = await provider(text, from, to);
          if (out) return to.startsWith('zh') ? toTW(out) : out;
        } catch (e) {
          lastError = e;
        }
      }
      if (lastError && /lượt dịch|mạng|chậm/.test(lastError.message)) throw lastError;
      throw new Error(to.startsWith('zh') ? 'Không tìm được bản dịch tiếng Trung phù hợp, hãy thử cách nói khác' : 'Không tìm được bản dịch tiếng Việt phù hợp, hãy thử cách nói khác');
    }

    /* =========================================================
       4. Nhận dạng giọng nói (Web Speech API)
       ========================================================= */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    /* 🔒 Chỉ cho phép tiếng Trung (zh-TW) hoặc tiếng Việt (vi-VN) */
    const ALLOWED_LANGS = ['zh-TW', 'vi-VN'];
    const lockLang = lang => (ALLOWED_LANGS.includes(lang) ? lang : 'zh-TW');
    const FOREIGN_SCRIPT = /[\u3040-\u30ff\u31f0-\u31ff\uac00-\ud7af\u1100-\u11ff]/;
    const VI_DIACRITIC = /[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i;
    function allowedSpeech(text) {
      const t = String(text || '').trim();
      if (!t) return { text: '', lang: '' };
      if (FOREIGN_SCRIPT.test(t)) return { text: '', lang: '' };
      if (CJK.test(t)) return { text: toTW(t), lang: 'zh' };
      if (VI_DIACRITIC.test(t)) return { text: t, lang: 'vi' };
      return { text: '', lang: '' };
    }

    const speechErrorText = code => ({
      'not-allowed': 'Quyền micro bị từ chối, hãy vào cài đặt trình duyệt để cho phép trang này dùng micro.',
      'service-not-allowed': 'Trình duyệt này không cho phép dịch vụ giọng nói. Trên điện thoại hãy dùng Chrome (Android) hoặc Safari (iPhone) và mở bằng địa chỉ https.',
      'no-speech': 'Không nghe thấy âm thanh, hãy lại gần micro và thử lại.',
      'audio-capture': 'Không tìm thấy micro, hãy kiểm tra thiết bị có thể ghi âm.',
      'network': 'Nhận dạng giọng nói cần kết nối mạng.',
      'aborted': 'Đã hủy ghi âm.',
    }[code] || `Lỗi nhận dạng giọng nói (${code})`);

    /* =========================================================
       Chú âm (注音符號): tự chuyển từ bính âm khi data.json không ghi sẵn
       ========================================================= */
    const ZY_INIT = { b: 'ㄅ', p: 'ㄆ', m: 'ㄇ', f: 'ㄈ', d: 'ㄉ', t: 'ㄊ', n: 'ㄋ', l: 'ㄌ', g: 'ㄍ', k: 'ㄎ', h: 'ㄏ', j: 'ㄐ', q: 'ㄑ', x: 'ㄒ', zh: 'ㄓ', ch: 'ㄔ', sh: 'ㄕ', r: 'ㄖ', z: 'ㄗ', c: 'ㄘ', s: 'ㄙ' };
    const ZY_FINAL = {
      a: 'ㄚ', o: 'ㄛ', e: 'ㄜ', 'ê': 'ㄝ', ai: 'ㄞ', ei: 'ㄟ', ao: 'ㄠ', ou: 'ㄡ', an: 'ㄢ', en: 'ㄣ', ang: 'ㄤ', eng: 'ㄥ', er: 'ㄦ', ong: 'ㄨㄥ',
      i: 'ㄧ', ia: 'ㄧㄚ', io: 'ㄧㄛ', ie: 'ㄧㄝ', iai: 'ㄧㄞ', iao: 'ㄧㄠ', iou: 'ㄧㄡ', ian: 'ㄧㄢ', in: 'ㄧㄣ', iang: 'ㄧㄤ', ing: 'ㄧㄥ', iong: 'ㄩㄥ',
      u: 'ㄨ', ua: 'ㄨㄚ', uo: 'ㄨㄛ', uai: 'ㄨㄞ', uei: 'ㄨㄟ', uan: 'ㄨㄢ', uen: 'ㄨㄣ', uang: 'ㄨㄤ', ueng: 'ㄨㄥ',
      'ü': 'ㄩ', 'üe': 'ㄩㄝ', 'üan': 'ㄩㄢ', 'ün': 'ㄩㄣ',
    };
    const ZY_TONE = { 1: '', 2: 'ˊ', 3: 'ˇ', 4: 'ˋ', 5: '' };
    const ZY_TONE_CHARS = { 1: 'āēīōūǖĀĒĪŌŪǕ', 2: 'áéíóúǘÁÉÍÓÚǗ', 3: 'ǎěǐǒǔǚǍĚǏǑǓǙ', 4: 'àèìòùǜÀÈÌÒÙǛ' };
    function zyToneOf(syl) {
      for (const ch of String(syl || '')) for (const n of [1, 2, 3, 4]) if (ZY_TONE_CHARS[n].includes(ch)) return n;
      const num = String(syl || '').match(/[1-5]$/);
      return num ? Number(num[0]) : 5;
    }
    /* Một âm tiết bính âm (có dấu thanh hoặc số 1–5) → chú âm, ví dụ "xiè" → "ㄒㄧㄝˋ" */
    function syllableToZhuyin(syl) {
      const tone = zyToneOf(syl);
      let s = String(syl || '').normalize('NFD').replace(/[̀́̄̌]/g, '').normalize('NFC')
        .toLowerCase().replace(/u:|v/g, 'ü').replace(/[^a-zêü]/g, '');
      if (!s) return '';
      let ini = '', fin = s;
      if (s === 'er') fin = 'er';
      else if (s[0] === 'y') { fin = s.slice(1); fin = fin[0] === 'u' ? 'ü' + fin.slice(1) : fin[0] === 'i' ? fin : 'i' + fin; }
      else if (s[0] === 'w') { fin = s.slice(1); if (fin[0] !== 'u') fin = 'u' + fin; }
      else { const m = s.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcs])/); if (m) { ini = m[1]; fin = s.slice(ini.length); } }
      if (/^[jqx]$/.test(ini) && fin[0] === 'u') fin = 'ü' + fin.slice(1);
      if (/^(zh|ch|sh|r|z|c|s)$/.test(ini) && fin === 'i') fin = '';
      if (fin === 'iu') fin = 'iou'; else if (fin === 'ui') fin = 'uei'; else if (fin === 'un') fin = 'uen';
      if (fin && !ZY_FINAL[fin]) return '';
      const zy = (ZY_INIT[ini] || '') + (fin ? ZY_FINAL[fin] : '');
      if (!zy) return '';
      return tone === 5 ? '˙' + zy : zy + ZY_TONE[tone];
    }
    /* Cả chuỗi bính âm (các âm tiết cách nhau bằng dấu cách) → chú âm */
    const pinyinToZhuyin = py => String(py || '').trim().split(/\s+/).map(syllableToZhuyin).filter(Boolean).join(' ');

    /* =========================================================
       5. Giáo trình tách rời: tải data.json từ GitHub bằng fetch()
       - Muốn thêm bài: chỉ cần sửa data.json trên GitHub, không phải sửa index.html
       - Thứ tự thử: DATA_URL (GitHub) → ./data.json (cùng thư mục) → bản lưu lần trước trên máy
       ========================================================= */
    // ⚠️ Thay bằng địa chỉ RAW của file data.json trên GitHub, dạng:
    //    https://raw.githubusercontent.com/<tài-khoản>/<repo>/main/data.json
    const DATA_URL = 'https://githubusercontent.com';
    const DATA_FALLBACK_URL = './data.json';
    const DATA_CACHE_KEY = 'zhl.curriculum.cache';
    const POS_KEYS = ['noun', 'verb', 'adj', 'pron', 'clf', 'other'];

    let WORDS = [];                 // các từ trong data.json (đã chuẩn hóa)
    let DICT = {};                  // tra nhanh: chữ phồn thể → { py, zy, vi, pos, ex, exVi }
    let MAX_WORD = 5;               // độ dài từ dài nhất (để tách từ)
    let CURRICULUM_META = { source: '', version: 0, updated: '', stale: false };
    const dictLookup = word => DICT[keyOf(word)] || null;

    /* Chuẩn hóa một từ: bắt buộc chinese + pinyin; zhuyin để trống sẽ tự chuyển từ pinyin */
    function normalizeWord(w, i) {
      if (!w || !w.chinese || !w.pinyin) return null;
      const pinyin = String(w.pinyin).trim();
      return {
        id: String(w.id || `w${i + 1}`),
        chinese: toTW(String(w.chinese).trim()),
        pinyin,
        zhuyin: String(w.zhuyin || '').trim() || pinyinToZhuyin(pinyin),
        vietnamese: String(w.vietnamese || '').trim(),
        example_ch: toTW(String(w.example_ch || '').trim()),
        example_vi: String(w.example_vi || '').trim(),
        pos: POS_KEYS.includes(w.pos) ? w.pos : 'other',
        level: String(w.level || 'beginner'),
        tags: Array.isArray(w.tags) ? w.tags : [],
      };
    }

    async function fetchCurriculum(url) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 12000);
      try {
        const res = await fetch(url, { cache: 'no-cache', signal: ctrl.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        let json;
        try { json = await res.json(); } catch (e) { throw new Error('nội dung không phải JSON'); }
        if (!json || !Array.isArray(json.words)) throw new Error('thiếu mảng "words"');
        return json;
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('quá thời gian chờ');
        if (e instanceof TypeError) throw new Error('không kết nối được (mạng hoặc CORS)');
        throw e;
      } finally {
        clearTimeout(timer);
      }
    }

    /* Trả về { json, source, stale }; lỗi hết mọi nguồn thì ném lỗi kèm chi tiết từng nguồn */
    async function loadCurriculum() {
      const tried = [];
      const sources = [[DATA_URL, 'GitHub'], [DATA_FALLBACK_URL, 'data.json cùng thư mục']];
      for (const [url, label] of sources) {
        if (!url) continue;
        try {
          const json = await fetchCurriculum(url);
          try { localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), json })); } catch (e) { /* bộ nhớ đầy */ }
          return { json, source: label, stale: false };
        } catch (e) {
          tried.push(`${label}: ${e.message}`);
        }
      }
      try {
        const cached = JSON.parse(localStorage.getItem(DATA_CACHE_KEY) || 'null');
        if (cached && cached.json && Array.isArray(cached.json.words)) {
          return { json: cached.json, source: `bản lưu trên máy (${new Date(cached.savedAt).toLocaleDateString('vi-VN')})`, stale: true };
        }
      } catch (e) { /* bản lưu hỏng */ }
      throw new Error(tried.join('\n'));
    }

    /* Nạp giáo trình vào bộ nhớ: từ điển, thư viện câu, các chương */
    function applyCurriculum(json, source = '', stale = false) {
      WORDS = (json.words || []).map(normalizeWord).filter(Boolean);
      DICT = {};
      WORDS.forEach(w => {
        if (!DICT[w.chinese]) DICT[w.chinese] = { py: w.pinyin, zy: w.zhuyin, vi: w.vietnamese, pos: w.pos, ex: w.example_ch, exVi: w.example_vi, level: w.level };
      });
      MAX_WORD = Math.min(8, Math.max(2, ...WORDS.map(w => [...w.chinese].length)));
      buildLibrary(json);
      buildCampaign(json);
      CURRICULUM_META = { source, stale, version: json.version || 0, updated: json.updated || '' };
    }

    /* =========================================================
       6. Tách từ tiếng Trung
       Ưu tiên từ điển có sẵn (khớp dài nhất); đoạn chưa biết giao cho Intl.Segmenter của trình duyệt;
       trình duyệt cũ không có Intl.Segmenter thì tách từng chữ.
       ========================================================= */
    const ZH_SEG = (() => { try { return typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('zh-Hant', { granularity: 'word' }) : null; } catch (e) { return null; } })();
    const startsMultiWord = (run, j) => {
      for (let L = Math.min(MAX_WORD, run.length - j); L >= 2; L--) if (DICT[run.slice(j, j + L)]) return true;
      return false;
    };
    function segment(text) {
      const t = toTW(String(text || '').trim());
      const out = [];
      const runs = t.match(/[\u3400-\u9fff\uf900-\ufaff]+|[^\u3400-\u9fff\uf900-\ufaff]+/g) || [];
      runs.forEach(run => {
        if (!CJK.test(run)) {
          run.split(/\s+/).map(stripPunct).filter(Boolean).forEach(w => out.push(w));
          return;
        }
        let i = 0;
        while (i < run.length) {
          let hit = null;
          for (let L = Math.min(MAX_WORD, run.length - i); L >= 2; L--) {
            const p = run.slice(i, i + L);
            if (DICT[p]) { hit = p; break; }
          }
          if (hit) { out.push(hit); i += hit.length; continue; }
          let j = i + 1;
          while (j < run.length && !startsMultiWord(run, j)) j++;
          const chunk = run.slice(i, j);
          if (ZH_SEG && chunk.length > 1) {
            for (const s of ZH_SEG.segment(chunk)) {
              const seg = s.segment;
              if (!seg.trim()) continue;
              // Từ trình duyệt ghép lại nhưng từ điển không có, mà từng chữ đều có (我想, 我的…) → tách từng chữ
              if (seg.length > 1 && !DICT[seg] && [...seg].every(c => DICT[c])) [...seg].forEach(c => out.push(c));
              else out.push(seg);
            }
          } else {
            [...chunk].forEach(c => out.push(c));
          }
          i = j;
        }
      });
      return out;
    }

    /* =========================================================
       7. Bính âm (pinyin) và thanh điệu
       ========================================================= */
    const TONE_CHARS = ZY_TONE_CHARS || { 1: 'āēīōūǖĀĒĪŌŪǕ', 2: 'áéíóúǘÁÉÍÓÚǗ', 3: 'ǎěǐǒǔǚǍĚǏǑǓǙ', 4: 'àèìòùǜÀÈÌÒÙǛ' };
    const toneNumOf = syl => {
      for (const ch of String(syl || '')) for (const n of [1, 2, 3, 4]) if (TONE_CHARS[n].includes(ch)) return n;
      return 5;
    };

    /* Bính âm theo từng âm tiết của một từ */
    function pinyinSyllables(word) {
      const w = keyOf(word);
      if (!w) return [];
      if (DICT[w] && DICT[w].py) {
        const syl = DICT[w].py.split(/\s+/);
        if (syl.length === [...w].length) return syl;   // bính âm trong data.json phải cách âm tiết bằng dấu cách
      }
      try {
        if (window.pinyinPro && CJK.test(w)) {
          const arr = window.pinyinPro.pinyin(toCN(w), { type: 'array', toneType: 'symbol', nonZh: 'removed' });
          if (arr && arr.length) return arr;
        }
      } catch (e) { /* thư viện chưa tải */ }
      return [...w].map(c => (DICT[c] && DICT[c].py) || '').filter(Boolean);
    }
    const pinyinWord = word => pinyinSyllables(word).join('');
    /* Chú âm theo từng âm tiết: ưu tiên trường "zhuyin" trong data.json, không có thì chuyển từ bính âm */
    function zhuyinSyllables(word) {
      const w = keyOf(word);
      if (DICT[w] && DICT[w].zy) {
        const zy = DICT[w].zy.split(/\s+/);
        if (zy.length === [...w].length) return zy;
      }
      return pinyinSyllables(w).map(syllableToZhuyin);
    }
    const zhuyinWord = word => zhuyinSyllables(word).join(' ');
    /* Chú âm cho ô trong bảng tra bính âm (thanh mẫu / vận mẫu) */
    const guideZhuyin = id => ZY_INIT[id] || { y: 'ㄧ', w: 'ㄨ', iu: 'ㄧㄡ', ui: 'ㄨㄟ', un: 'ㄨㄣ' }[id] || ZY_FINAL[id] || '';
    const pinyinSentence = sentence => segment(sentence).map(pinyinWord).filter(Boolean).join(' ');

    /* 4 thanh + thanh nhẹ, so sánh với thanh điệu tiếng Việt */
    const TONE_LIST = [
      { id: 1, name: 'Thanh 1', zh: '一聲', sample: 'ā', example: '媽', py: 'mā', exVi: 'mẹ', rule: 'Cao và đều, giữ giọng ở mức cao (giống thanh ngang nhưng cao hơn)', path: 'M3 4 L29 4' },
      { id: 2, name: 'Thanh 2', zh: '二聲', sample: 'á', example: '麻', py: 'má', exVi: 'tê; cây gai', rule: 'Đi lên từ giữa lên cao, giống thanh sắc', path: 'M3 15 L29 3' },
      { id: 3, name: 'Thanh 3', zh: '三聲', sample: 'ǎ', example: '馬', py: 'mǎ', exVi: 'con ngựa', rule: 'Xuống thấp rồi vòng lên, giống thanh hỏi', path: 'M3 8 Q15 26 29 5' },
      { id: 4, name: 'Thanh 4', zh: '四聲', sample: 'à', example: '罵', py: 'mà', exVi: 'mắng', rule: 'Rơi mạnh từ cao xuống thấp, dứt khoát', path: 'M3 3 L29 19' },
      { id: 5, name: 'Thanh nhẹ', zh: '輕聲', sample: 'a', example: '嗎', py: 'ma', exVi: '(trợ từ hỏi)', rule: 'Ngắn và nhẹ, không nhấn giọng', path: '' },
    ];
    const toneInfo = n => TONE_LIST.find(t => t.id === n) || TONE_LIST[4];

    /* =========================================================
       8. Bảng bính âm: thanh mẫu (phụ âm đầu) và vận mẫu (vần)

    /* =========================================================
       9. Thư viện câu vàng (luyện tập tự do)
       sentence: câu tiếng Trung (phồn thể) / trans: nghĩa tiếng Việt
       ========================================================= */
    const shuffle = arr => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    };

    /* Thư viện câu (luyện tự do): lấy từ "library" trong data.json; nếu không có thì dùng câu ví dụ của từng từ */
    let OFFICIAL_LIBRARY = {};      // { mã nhóm: [{ sentence, trans }] }
    let LIBRARY_TABS = [];          // [[mã nhóm, nhãn]]
    const DEFAULT_LIBRARY_LABELS = { beginner: '🌱 Sơ cấp', intermediate: '🌿 Trung cấp', advanced: '🔥 Cao cấp', phrases: '💬 Đời sống' };
    const toQ = q => (q && q.chinese ? { sentence: toTW(String(q.chinese).trim()), trans: String(q.vietnamese || '').trim() } : null);

    function buildLibrary(json) {
      const lib = {};
      if (json.library && typeof json.library === 'object') {
        Object.entries(json.library).forEach(([k, list]) => { lib[k] = (Array.isArray(list) ? list : []).map(toQ).filter(Boolean); });
      } else {
        WORDS.forEach(w => { if (w.example_ch) (lib[w.level] = lib[w.level] || []).push({ sentence: w.example_ch, trans: w.example_vi }); });
      }
      const labels = { ...DEFAULT_LIBRARY_LABELS };
      const order = [];
      (Array.isArray(json.library_tabs) ? json.library_tabs : []).forEach(t => { if (t && t.id) { labels[t.id] = t.label || t.id; order.push(t.id); } });
      Object.keys(DEFAULT_LIBRARY_LABELS).concat(Object.keys(lib)).forEach(k => { if (!order.includes(k)) order.push(k); });
      OFFICIAL_LIBRARY = lib;
      LIBRARY_TABS = order.filter(k => lib[k] && lib[k].length).map(k => [k, labels[k] || k]);
    }

    const LIBRARY_PAGE_SIZE = 4;
    function drawLibraryPage(level, current = []) {
      const all = (OFFICIAL_LIBRARY[level] || []).map((_, i) => i);
      const size = Math.min(LIBRARY_PAGE_SIZE, all.length);
      const fresh = shuffle(all.filter(i => !current.includes(i)));
      if (fresh.length >= size) return fresh.slice(0, size);
      return [...fresh, ...shuffle(current).slice(0, size - fresh.length)];
    }

    /* =========================================================
       10. Nhiệm vụ chính: lấy từ "chapters" trong data.json
       Nếu data.json không có "chapters": cứ 3 từ thành một ải, câu hỏi là câu ví dụ của từng từ
       ========================================================= */
    const CH_NAMES = ['Chương 1', 'Chương 2', 'Chương 3', 'Chương 4', 'Chương 5', 'Chương 6', 'Chương 7', 'Chương 8'];
    let CAMPAIGN = [];
    let ALL_LEVELS = [];
    let PLAYABLE_LEVELS = [];
    let DEFAULT_UNLOCKED = [1];

    function autoChapters() {
      const withEx = WORDS.filter(w => w.example_ch);
      const levels = [];
      for (let i = 0; i < withEx.length; i += 3) {
        const chunk = withEx.slice(i, i + 3);
        levels.push({ n: levels.length + 1, name: chunk.map(w => w.chinese).join('・'), questions: chunk.map(w => ({ chinese: w.example_ch, vietnamese: w.example_vi })) });
      }
      if (!levels.length) return [];
      return [{ icon: '🌱', title: 'Từ vựng cơ bản', goal: 'Mỗi ải gồm câu ví dụ của 3 từ trong giáo trình.', total: levels.length, unlocked: true, groups: [{ from: 1, to: levels.length, theme: 'Từ vựng', levels }] }];
    }

    function buildCampaign(json) {
      const chapters = Array.isArray(json.chapters) && json.chapters.length ? json.chapters : autoChapters();
      CAMPAIGN = chapters.map((ch, ci) => {
        const id = ci + 1;
        const groups = (ch.groups || []).map(g => ({
          from: Number(g.from) || 1, to: Number(g.to) || Number(g.from) || 1, theme: g.theme || 'Tự luyện',
          levels: Array.isArray(g.levels) ? g.levels : Object.entries(g.levels || {}).map(([n, l]) => ({ ...l, n: Number(n) })),
        }));
        const total = Number(ch.total) || Math.max(1, ...groups.map(g => g.to));
        const levels = [];
        for (let n = 1; n <= total; n++) {
          const group = groups.find(g => n >= g.from && n <= g.to) || { theme: 'Tự luyện', from: n, to: n, levels: [] };
          const data = group.levels.find(l => Number(l.n) === n);
          levels.push({
            id: `${id}-${n}`, n, chapter: id, theme: group.theme, groupFrom: group.from,
            name: data && data.name ? data.name : `${group.theme}・ải ${n - group.from + 1}`,
            questions: data ? (data.questions || []).map(toQ).filter(Boolean) : [],
          });
        }
        return {
          id, icon: ch.icon || '📘', name: CH_NAMES[ci] || `Chương ${id}`,
          title: String(ch.title || '').replace(/^Chương \d+:\s*/, ''), goal: ch.goal || '',
          unlockedByDefault: ci === 0 || !!ch.unlocked,
          groups: groups.map(({ from, to, theme }) => ({ from, to, theme })),
          levels,
        };
      });
      ALL_LEVELS = CAMPAIGN.flatMap(ch => ch.levels);
      PLAYABLE_LEVELS = ALL_LEVELS.filter(lv => lv.questions.length);
      DEFAULT_UNLOCKED = CAMPAIGN.filter(ch => ch.unlockedByDefault).map(ch => ch.id);
    }

    const doneCount = (lv, p) => lv.questions.filter((_, i) => p && p.done && p.done[i]).length;
    const levelStatus = (lv, p) => (p && p.clearedAt ? 'cleared' : p && (p.started || doneCount(lv, p) > 0) ? 'active' : 'idle');
    const chapterCleared = (ch, progress) =>
      ch.levels.filter(lv => lv.questions.length).every(lv => levelStatus(lv, progress[lv.id]) === 'cleared');

    function computeLevelStates(progress, unlockedChapters) {
      const states = {};
      CAMPAIGN.forEach(ch => {
        const chUnlocked = unlockedChapters.includes(ch.id);
        let prevCleared = true;
        ch.levels.forEach(lv => {
          if (!chUnlocked) { states[lv.id] = 'locked'; return; }
          if (!lv.questions.length) { states[lv.id] = 'soon'; return; }
          const st = levelStatus(lv, progress[lv.id]);
          states[lv.id] = st === 'cleared' ? 'cleared' : prevCleared ? (st === 'active' ? 'active' : 'open') : 'locked';
          prevCleared = st === 'cleared';
        });
      });
      return states;
    }
    const isPlayable = st => st === 'open' || st === 'active' || st === 'cleared';

    /* Khối ghép câu: tách từ, bỏ dấu câu */
    const answerTiles = sentence => segment(sentence).map(stripPunct).filter(Boolean);

    /* 3 cấp sao + nứt vì quên */
    const STAR_MODES = [
      { mode: 1, stars: '⭐', name: 'Ánh sáng đầu tiên', short: 'Tra từ', desc: 'Xem nghĩa tiếng Việt, được bấm từng từ để xem bính âm và nghĩa, rồi ghép câu' },
      { mode: 2, stars: '⭐⭐', name: 'Luyện kim nội hóa', short: 'Ghép mù', desc: 'Chỉ xem nghĩa tiếng Việt, không có gợi ý, ghép câu bằng trí nhớ' },
      { mode: 3, stars: '⭐⭐⭐', name: 'Đại sư huyền thoại', short: 'Chỉ nghe', desc: 'Không có chữ, nghe câu và ghép trong 15 giây, rồi chọn đúng nghĩa tiếng Việt' },
    ];
    const CRACK_AFTER = 3 * 24 * 60 * 60 * 1000;
    const LISTEN_TIME = 15000;
    const starsOf = entry => (entry && entry.stars) || 0;
    const isCracked = (entry, now) => starsOf(entry) >= 3 && now - ((entry && entry.reviewedAt) || now) >= CRACK_AFTER;

    function meaningOptions(correct) {
      const others = shuffle([...new Set(ALL_LEVELS.flatMap(lv => lv.questions.map(q => q.trans)).filter(t => t !== correct))]).slice(0, 2);
      return shuffle([correct, ...others]);
    }

    /* 6 loại từ */
    const POS = {
      noun:  { label: 'Danh từ', tag: 'bg-violet-50 text-violet-600' },
      verb:  { label: 'Động từ', tag: 'bg-sky-50 text-sky-600' },
      adj:   { label: 'Tính từ', tag: 'bg-pink-50 text-pink-600' },
      pron:  { label: 'Đại từ', tag: 'bg-teal-50 text-teal-700' },
      clf:   { label: 'Lượng từ', tag: 'bg-indigo-50 text-indigo-600' },
      other: { label: 'Khác', tag: 'bg-slate-100 text-slate-500' },
    };
    const posInfo = p => POS[p] || POS.other;
    const firstMeaning = m => ((m || '').split(/[,;，、／/；]/)[0] || '').replace(/（.*?）|\(.*?\)/g, '').trim();

    /* =========================================================
       11. Giọng đọc tiếng Trung (và tiếng Việt cho lời hướng dẫn)
       ========================================================= */
    const VOICE_STATE = { all: [], zh: [], vi: [], preferred: null, loaded: false, listeners: new Set() };
    const normLang = l => (l || '').toLowerCase().replace('_', '-');
    const isZhVoice = v => { const l = normLang(v.lang); return (l.startsWith('zh') || l.startsWith('cmn')) && !/hk|yue|cantonese|粵/.test(l + ' ' + (v.name || '').toLowerCase()); };

    function rankVoice(v) {
      const n = (v.name || '').toLowerCase();
      const l = normLang(v.lang);
      let score = 0;
      if (/natural|online/.test(n)) score += 50;
      if (/premium|enhanced|增強|高品質|siri/.test(n)) score += 40;
      if (/mei-?jia|hsiaochen|hsiaoyu|yating|xiaoxiao|tingting|hanhan|美佳|曉/.test(n)) score += 30;
      if (/google/.test(n)) score += 20;
      if (/female|女/.test(n)) score += 10;
      if (SCRIPT.mode === 'simp' ? /cn/.test(l) : /tw/.test(l)) score += 8;
      return score;
    }

    function refreshVoices() {
      if (!('speechSynthesis' in window)) return;
      const all = window.speechSynthesis.getVoices() || [];
      VOICE_STATE.all = all;
      VOICE_STATE.zh = all.filter(isZhVoice).sort((a, b) => rankVoice(b) - rankVoice(a));
      VOICE_STATE.vi = all.filter(v => normLang(v.lang).startsWith('vi'));
      if (all.length) VOICE_STATE.loaded = true;
      VOICE_STATE.listeners.forEach(fn => fn());
    }
    function getActiveVoice() {
      const list = VOICE_STATE.zh;
      if (!list.length) return null;
      return list.find(v => v.name === VOICE_STATE.preferred) || list[0];
    }
    const getViVoice = () => VOICE_STATE.vi[0] || null;

    const LIVE_UTTERANCES = [];
    let speakDelayTimer = null;
    let keepAliveTimer = null;
    const UA = navigator.userAgent;
    const NEEDS_KEEPALIVE = /Chrome/.test(UA) && !/Edg|Android|Mobile|CriOS/.test(UA);
    function stopKeepAlive() { clearInterval(keepAliveTimer); keepAliveTimer = null; }
    function startKeepAlive() {
      if (!NEEDS_KEEPALIVE) return;
      stopKeepAlive();
      keepAliveTimer = setInterval(() => {
        const synth = window.speechSynthesis;
        if (!synth.speaking) { stopKeepAlive(); return; }
        if (!synth.paused) { synth.pause(); synth.resume(); }
      }, 10000);
    }

    /* Đọc tiếng Trung bằng giọng của hệ thống */
    function speakChinese(input, { rate = 0.8 } = {}) {
      if (!window.speechSynthesis) return { ok: false, reason: 'unsupported' };
      const synth = window.speechSynthesis;
      const wasBusy = synth.speaking || synth.pending;
      stopCloudAudio();
      synth.cancel();
      clearTimeout(speakDelayTimer);
      stopKeepAlive();
      LIVE_UTTERANCES.length = 0;

      const texts = (Array.isArray(input) ? input : [input]).map(t => String(t || '').replace(/\.{2,}|…/g, ' ').trim()).filter(Boolean);
      if (!texts.length) return { ok: false, reason: 'empty' };
      if (!VOICE_STATE.all.length) refreshVoices();
      const voice = getActiveVoice();

      const run = () => {
        texts.forEach(text => {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = voice ? voice.lang : (SCRIPT.mode === 'simp' ? 'zh-CN' : 'zh-TW');
          if (voice) u.voice = voice;
          u.rate = rate;
          u.pitch = 1.0;
          u.volume = 1.0;
          const done = () => {
            const i = LIVE_UTTERANCES.indexOf(u);
            if (i >= 0) LIVE_UTTERANCES.splice(i, 1);
            if (!LIVE_UTTERANCES.length) stopKeepAlive();
          };
          u.onend = done;
          u.onerror = done;
          LIVE_UTTERANCES.push(u);
          synth.speak(u);
        });
        if (synth.paused) synth.resume();
        startKeepAlive();
      };
      if (wasBusy) speakDelayTimer = setTimeout(run, 120);
      else run();
      return { ok: true, voice };
    }

    /* ☁️ Giọng đọc đám mây qua Worker riêng của bạn (Google TTS) */
    let cloudAudio = null;
    let cloudToken = 0;
    let cloudBroken = false;
    const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    function voiceSource() {
      try { const v = JSON.parse(localStorage.getItem('zhl.voiceSource')); return ['auto', 'system', 'cloud'].includes(v) ? v : 'auto'; } catch (e) { return 'auto'; }
    }
    const cloudReady = () => {
      if (!(typeof syncReady === 'function' && syncReady()) || cloudBroken) return false;
      const src = voiceSource();
      if (src === 'cloud') return true;
      if (src === 'system') return false;
      if (IS_MOBILE) return true;
      return !VOICE_STATE.zh.length;   // máy tính: có giọng tiếng Trung sẵn thì dùng giọng hệ thống
    };
    const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    function getCloudAudio() {
      if (!cloudAudio) {
        cloudAudio = new Audio();
        cloudAudio.preload = 'auto';
        cloudAudio.setAttribute('playsinline', '');
      }
      return cloudAudio;
    }
    /* iPhone yêu cầu lần phát đầu tiên phải ngay khi người dùng chạm: “mở khóa” bằng âm thanh im lặng */
    document.addEventListener('pointerdown', () => {
      try { const a = getCloudAudio(); a.src = SILENT_WAV; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    }, { once: true, capture: true });

    function stopCloudAudio() {
      cloudToken++;
      if (cloudAudio) { try { cloudAudio.pause(); } catch (e) {} }
    }
    function stopAllSpeech() {
      stopCloudAudio();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }
    function splitForCloud(text) {
      const t = String(text || '').replace(/\s+/g, ' ').trim();
      if (t.length <= 180) return t ? [t] : [];
      const parts = t.replace(/([.!?;:,。！？；：，、])\s*/g, '$1\n').split('\n').filter(Boolean);
      const out = [];
      let cur = '';
      parts.forEach(p => {
        if ((cur + ' ' + p).trim().length > 180 && cur) { out.push(cur.trim()); cur = p; }
        else cur = (cur + ' ' + p).trim();
      });
      if (cur) out.push(cur.trim());
      return out.flatMap(x => (x.length > 180 ? x.match(/.{1,180}/g) : [x]));
    }
    function playCloud(text, lang, rate, token, onStart) {
      return new Promise((resolve, reject) => {
        if (token !== cloudToken) { resolve(); return; }
        const a = getCloudAudio();
        let started = false;
        const guard = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 20000);
        const cleanup = () => { clearTimeout(guard); a.onplaying = a.onended = a.onerror = null; };
        a.onplaying = () => {
          a.playbackRate = rate;
          if (!started) { started = true; if (onStart) onStart(); }
        };
        a.onended = () => { cleanup(); resolve(); };
        a.onerror = () => { cleanup(); reject(new Error('audio_error')); };
        a.src = `${syncBase()}/api/tts?lang=${lang}&q=${encodeURIComponent(text)}`;
        try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch (e) {}
        a.defaultPlaybackRate = rate;
        a.playbackRate = rate;
        const p = a.play();
        if (p && p.catch) p.catch(err => { cleanup(); reject(err); });
      });
    }
    async function cloudSpeak(parts) {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      stopCloudAudio();
      const token = cloudToken;
      for (const part of parts) {
        const lang = part.lang === 'vi' ? 'vi' : 'zh-TW';
        const rate = part.rate || (part.lang === 'vi' ? 1 : 0.85);
        const chunks = splitForCloud(part.text);
        for (let i = 0; i < chunks.length; i++) {
          if (token !== cloudToken) return;
          await playCloud(chunks[i], lang, rate, token, i === 0 ? part.onStart : null);
        }
      }
    }

    /* Hàm đọc tiếng Trung dùng chung toàn app: ưu tiên đám mây, lỗi thì dùng giọng hệ thống */
    function speak(textOrList, rate = 0.8) {
      const list = (Array.isArray(textOrList) ? textOrList : [textOrList]).map(t => String(t || '').trim()).filter(Boolean);
      if (!list.length) return false;
      if (cloudReady()) {
        cloudSpeak(list.map(text => ({ lang: 'zh', text, rate }))).catch(err => {
          if (err && err.name === 'NotAllowedError') return;
          cloudBroken = true;
          speakChinese(list, { rate });
        });
        return true;
      }
      return speakChinese(list, { rate }).ok;
    }

    /* Đọc xen kẽ Việt – Trung (giáo viên ảo): đọc xong toàn bộ mới trả về */
    function speakMixed(parts) {
      if (cloudReady()) {
        return cloudSpeak(parts).catch(err => {
          if (!(err && err.name === 'NotAllowedError')) cloudBroken = true;
          return speakMixedSynth(parts);
        });
      }
      return speakMixedSynth(parts);
    }
    function speakMixedSynth(parts) {
      return new Promise(resolve => {
        if (!('speechSynthesis' in window)) { resolve(); return; }
        const synth = window.speechSynthesis;
        const wasBusy = synth.speaking || synth.pending;
        synth.cancel();
        if (!VOICE_STATE.all.length) refreshVoices();
        const zh = getActiveVoice();
        const vi = getViVoice();
        const list = parts.filter(x => x.text);
        if (!list.length) { resolve(); return; }
        let finished = false;
        const done = () => { if (!finished) { finished = true; clearTimeout(guard); resolve(); } };
        const totalChars = list.reduce((n, x) => n + x.text.length, 0);
        const guard = setTimeout(done, Math.max(4000, totalChars * 320));
        const run = () => {
          list.forEach((x, i) => {
            const u = new SpeechSynthesisUtterance(x.text);
            if (x.lang === 'vi') { u.lang = vi ? vi.lang : 'vi-VN'; if (vi) u.voice = vi; u.rate = x.rate || 1; }
            else { u.lang = zh ? zh.lang : 'zh-TW'; if (zh) u.voice = zh; u.rate = x.rate || 0.85; }
            if (x.onStart) u.onstart = x.onStart;
            if (i === list.length - 1) { u.onend = done; u.onerror = done; }
            LIVE_UTTERANCES.push(u);
            synth.speak(u);
          });
        };
        if (wasBusy) setTimeout(run, 120); else run();
      });
    }

    /* Hook: theo dõi danh sách giọng tiếng Trung */
    function useChineseVoices() {
      const [, force] = useState(0);
      const [preferred, setPreferred] = useLocalStorage('zhl.voiceName', null);
      VOICE_STATE.preferred = preferred;
      useEffect(() => {
        if (!('speechSynthesis' in window)) return;
        const update = () => force(x => x + 1);
        VOICE_STATE.listeners.add(update);
        const synth = window.speechSynthesis;
        refreshVoices();
        if (synth.addEventListener) synth.addEventListener('voiceschanged', refreshVoices);
        else synth.onvoiceschanged = refreshVoices;
        let tries = 0;
        const poll = setInterval(() => {
          tries++;
          refreshVoices();
          if (VOICE_STATE.zh.length || tries > 12) clearInterval(poll);
        }, 250);
        return () => {
          VOICE_STATE.listeners.delete(update);
          clearInterval(poll);
          if (synth.removeEventListener) synth.removeEventListener('voiceschanged', refreshVoices);
        };
      }, []);
      return { supported: 'speechSynthesis' in window, loaded: VOICE_STATE.loaded, voices: VOICE_STATE.zh, active: getActiveVoice(), setPreferred };
    }

    /* =========================================================
       Phiên âm hiển thị: 'pinyin' bính âm / 'zhuyin' chú âm / 'both' cả hai / 'off' ẩn
       (App cập nhật PHONETIC.mode mỗi lần render)
       ========================================================= */
    const PHONETIC = { mode: (() => { try { const v = JSON.parse(localStorage.getItem('zhl.phonetic')); return ['pinyin', 'zhuyin', 'both', 'off'].includes(v) ? v : 'pinyin'; } catch (e) { return 'pinyin'; } })() };
    const PHONETIC_MODES = [['pinyin', 'Bính âm'], ['zhuyin', 'Chú âm ㄅㄆㄇ'], ['both', 'Cả hai'], ['off', 'Ẩn']];
    const showPinyin = () => PHONETIC.mode === 'pinyin' || PHONETIC.mode === 'both';
    const showZhuyin = () => PHONETIC.mode === 'zhuyin' || PHONETIC.mode === 'both';
    const phoneticText = word => [showPinyin() ? pinyinWord(word) : '', showZhuyin() ? zhuyinWord(word) : ''].filter(Boolean).join(' · ');
    function PhonWord({ word, className = '' }) {
      if (PHONETIC.mode === 'off') return null;
      return (
        <span className={`flex flex-col items-center leading-none ${className}`}>
          {showPinyin() && <span className="py text-xs text-slate-400">{pinyinWord(word) || '\u00a0'}</span>}
          {showZhuyin() && <span className="zy mt-0.5 text-[11px] text-sky-600">{zhuyinWord(word) || '\u00a0'}</span>}
        </span>
      );
    }
    function PhonSentence({ text, className = '', force = false }) {
      if (PHONETIC.mode === 'off' && !force) return null;
      const segs = segment(text).filter(w => stripPunct(w));
      const py = force ? true : showPinyin(), zy = force ? true : showZhuyin();
      return (
        <span className={`block ${className}`}>
          {py && <span className="py block text-xs text-emerald-600">{segs.map(pinyinWord).filter(Boolean).join(' ')}</span>}
          {zy && <span className="zy block text-xs text-sky-600">{segs.map(zhuyinWord).filter(Boolean).join('　')}</span>}
        </span>
      );
    }
    /* Nút chọn cách hiển thị phiên âm */
    function PhoneticSwitch({ value, onChange }) {
      return (
        <div className="inline-flex flex-wrap items-center gap-1 rounded-xl bg-slate-100 p-1 text-xs">
          {PHONETIC_MODES.map(([k, label]) => (
            <button key={k} onClick={() => onChange(k)} className={`rounded-lg px-2.5 py-1.5 font-medium transition ${value === k ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>{label}</button>
          ))}
        </div>
      );
    }

    );
    const PhoneIcon = ({ className = 'h-6 w-6' }) => (

        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z" />

    /* Đường cong cao độ của thanh điệu */
    function ToneCurve({ tone, className = 'h-5 w-8' }) {

        ['android', 'Android', 'Cài đặt → Đầu ra chuyển văn bản thành giọng nói → Cài đặt dịch vụ giọng nói của Google → Cài đặt dữ liệu giọng nói → Tiếng Trung.'],

              </div>
              <div className="grid grid-cols-3 gap-1 rounded-xl bg-slate-100 p-1">
                {SOURCES.map(([k, label, hint]) => (
                  <button
                    key={k}
                    onClick={() => { try { localStorage.setItem('zhl.voiceSource', JSON.stringify(k)); } catch (e) {} setSource(k); speak('你好，我是你的中文老師。'); }}
                    className={`rounded-lg px-2 py-2 text-center transition ${source === k ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                  >

            {!supported ? (

            ) : voices.length ? (

                <p className="mt-3 text-sm text-slate-500">Tìm thấy {voices.length} giọng tiếng Trung, giọng đứng đầu thường tự nhiên nhất.</p>

                  <div className="mt-1 text-xs leading-relaxed text-slate-500">{text}</div>

    const CountBadge = ({ n, long = false }) => (
      <span key={n} className="bump inline-block whitespace-nowrap rounded bg-amber-50 px-1.5 py-0.5 text-xs font-semibold text-amber-600">

    /* Khối từ: bính âm nhỏ ở trên, chữ Hán to ở dưới */
    function WordChip({ word, open, saved, hits, onClick, chipRef, speaking, showPy }) {
      return (

          <button
            ref={chipRef}
            onClick={e => { e.stopPropagation(); onClick(); }}
            className={`relative flex select-none flex-col items-center rounded-xl border px-4 py-2 text-slate-800 transition-all duration-200 cursor-pointer active:scale-[.97] focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-300 ${
              speaking ? 'speaking-chip scale-105 border-emerald-500 bg-emerald-50/70 text-emerald-700 shadow-lg'
                : open ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-slate-100 hover:bg-emerald-50'}`}
          >
            {showPy && <PhonWord word={word} className="mb-1" />}
            <span className="zh text-2xl font-medium leading-tight">{disp(word)}</span>
            {saved && <span className="absolute -top-1.5 -right-1.5 grid h-4 w-4 place-items-center rounded-full bg-emerald-500 text-[9px] text-white">✓</span>}
          </button>
          <div className="mt-1 h-5">{hits >= 2 && <CountBadge n={hits} />}</div>
        </div>
      );
